<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MemAlt - Merkez Yönetim ve Şube Raporları</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-6">

    <div class="max-w-7xl mx-auto">
        <!-- Başlık ve Kontroller -->
        <div class="flex flex-col md:flex-row justify-between items-center mb-6 bg-white p-4 rounded-xl shadow">
            <h1 class="text-2xl font-bold text-gray-800">Merkez Şube Raporlama Paneli</h1>
            
            <div class="flex gap-4 mt-4 md:mt-0">
                <!-- Şube Seçimi -->
                <div>
                    <label class="block text-sm font-medium text-gray-700">Şube Seçin</label>
                    <select id="subeFiltre" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border">
                        <option value="Tumu">Tüm Şubeler</option>
                        <option value="Soğanlık Şubesi">Soğanlık Şubesi</option>
                        <option value="Kurtköy Şubesi">Kurtköy Şubesi</option>
                        <option value="Ortadağ Şubesi">Ortadağ Şubesi</option>
                    </select>
                </div>

                <!-- Ay Seçimi -->
                <div>
                    <label class="block text-sm font-medium text-gray-700">Ay Seçin</label>
                    <input type="month" id="ayFiltre" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border">
                </div>
            </div>
        </div>

        <!-- Özet Kartları -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-6">
            <div class="bg-white p-4 rounded-xl shadow border-l-4 border-green-500">
                <p class="text-sm text-gray-500">Toplam Nakit</p>
                <p id="toplamNakit" class="text-xl font-bold text-gray-800">0.00 TL</p>
            </div>
            <div class="bg-white p-4 rounded-xl shadow border-l-4 border-blue-500">
                <p class="text-sm text-gray-500">Toplam Kredi Kartı</p>
                <p id="toplamKrediKarti" class="text-xl font-bold text-gray-800">0.00 TL</p>
            </div>
            <div class="bg-white p-4 rounded-xl shadow border-l-4 border-purple-500">
                <p class="text-sm text-gray-500">Toplam Yemek Kartı</p>
                <p id="toplamYemekKarti" class="text-xl font-bold text-gray-800">0.00 TL</p>
            </div>
            <div class="bg-white p-4 rounded-xl shadow border-l-4 border-red-500">
                <p class="text-sm text-gray-500">Toplam Masraf</p>
                <p id="toplamMasraf" class="text-xl font-bold text-gray-800">0.00 tar</p>
            </div>
        </div>

        <!-- Rapor Tablosu -->
        <div class="bg-white rounded-xl shadow overflow-hidden">
            <table class="min-w-full divide-y divide-gray-200">
                <thead class="bg-gray-50">
                    <tr>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Tarih</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Şube</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Nakit</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Kredi Kartı</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Yemek Kartları</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Masraf</th>
                    </tr>
                </thead>
                <tbody id="raporListesi" class="bg-white divide-y divide-gray-200">
                    <!-- Veriler dinamik olarak buraya dolacak -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        function verileriFiltreleVeGoster() {
            const secilenSube = document.getElementById('subeFiltre').value;
            const secilenAy = document.getElementById('ayFiltre').value;

            // Şubelerin kaydettiği ortak localStorage verisini alıyoruz
            const tumRaporlar = JSON.parse(localStorage.getItem('memaltRaporlar')) || [];

            const tabloGovdesi = document.getElementById('raporListesi');
            tabloGovdesi.innerHTML = '';

            let toplamNakit = 0;
            let toplamKredi = 0;
            let toplamYemek = 0;
            let toplamMasraf = 0;

            const filtrelenmis = tumRaporlar.filter(item => {
                let subeUyumlu = (secilenSube === 'Tumu' || item.subeAdi === secilenSube);
                let ayUyumlu = true;

                if (secilenAy && item.tarih) {
                    let raporAy = item.tarih.substring(0, 7); // YYYY-MM
                    ayUyumlu = (raporAy === secilenAy);
                }

                return subeUyumlu && ayUyumlu;
            });

            if (filtrelenmis.length === 0) {
                tabloGovdesi.innerHTML = `<tr><td colspan="6" class="px-6 py-4 text-center text-gray-500">Kayıt bulunamadı.</td></tr>`;
            } else {
                filtrelenmis.forEach(item => {
                    toplamNakit += Number(item.nakit || 0);
                    toplamKredi += Number(item.krediKarti || 0);
                    toplamYemek += Number(item.yemekKarti || 0);
                    toplamMasraf += Number(item.masrafTutar || 0);

                    tabloGovdesi.innerHTML += `
                        <tr>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-700">${item.tarih || ''}</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">${item.subeAdi || ''}</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-700">${Number(item.nakit || 0).toLocaleString('tr-TR')} TL</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-700">${Number(item.krediKarti || 0).toLocaleString('tr-TR')} TL</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-700">${Number(item.yemekKarti || 0).toLocaleString('tr-TR')} TL</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-red-600">${Number(item.masrafTutar || 0).toLocaleString('tr-TR')} TL</td>
                        </tr>
                    `;
                });
            }

            document.getElementById('toplamNakit').innerText = toplamNakit.toLocaleString('tr-TR') + ' TL';
            document.getElementById('toplamKrediKarti').innerText = toplamKredi.toLocaleString('tr-TR') + ' TL';
            document.getElementById('toplamYemekKarti').innerText = toplamYemek.toLocaleString('tr-TR') + ' TL';
            document.getElementById('toplamMasraf').innerText = toplamMasraf.toLocaleString('tr-TR') + ' TL';
        }

        document.getElementById('subeFiltre').addEventListener('change', verileriFiltreleVeGoster);
        document.getElementById('ayFiltre').addEventListener('change', verileriFiltreleVeGoster);

        window.onload = verileriFiltreleVeGoster;
    </script>
</body>
</html>
