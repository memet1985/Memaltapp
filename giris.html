<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sweet Waffle - Giriş Paneli</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#78350f">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { box-sizing: border-box; -webkit-text-size-adjust: 100%; }
        html, body { width: 100%; max-width: 100vw; overflow-x: hidden; margin: 0; padding: 0; background-color: #f9fafb; font-family: sans-serif; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <div style="width: 100%; max-width: 360px; background: #fff; border: 1px solid #fcd34d; border-radius: 16px; padding: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.06); text-align: center;">
        
        <!-- Logo / Başlık Alanı -->
        <div style="width: 60px; height: 60px; background: #fffbeb; border: 2px solid #78350f; border-radius: 12px; display: flex; align-items: center; justify-content: center; margin: 0 auto 12px auto; overflow: hidden;">
            <img src="logo.webp" alt="Logo" style="width: 100%; height: 100%; object-fit: contain;" onerror="this.style.display='none'; document.getElementById('logoFallback').style.display='flex';">
            <div id="logoFallback" style="width: 100%; height: 100%; background: #78350f; color: #fff; font-weight: bold; font-size: 10px; display: none; align-items: center; justify-content: center;">SW</div>
        </div>
        
        <h1 style="font-size: 16px; font-weight: 900; color: #451a03; margin: 0 0 4px 0;">Sweet Waffle</h1>
        <p style="font-size: 11px; color: #6b7280; margin: 0 0 20px 0;">Lütfen giriş yapmak istediğiniz birimi seçin</p>

        <!-- Butonlar Listesi -->
        <div style="display: flex; flex-direction: column; gap: 10px;">
            
            <!-- Merkez Butonu (En Üstte) -->
            <button onclick="girisYap('merkez', '1985', 'index.html')" style="background: #78350f; color: #fff; border: none; border-radius: 10px; padding: 12px; font-size: 13px; font-weight: bold; cursor: pointer; text-transform: uppercase; box-shadow: 0 2px 4px rgba(120,53,15,0.3);">
                🏢 Merkez Yönetim
            </button>

            <hr style="border: none; border-top: 1px dashed #fde68a; margin: 4px 0;">

            <!-- Kurtköy Şubesi -->
            <button onclick="girisYap('kurtkoy', '2025', 'sube.html?ad=Kurtkoy')" style="background: #fffbeb; color: #78350f; border: 1px solid #fde68a; border-radius: 10px; padding: 10px; font-size: 12px; font-weight: bold; cursor: pointer;">
                📍 Kurtköy Şubesi
            </button>

            <!-- Soğanlık Şubesi -->
            <button onclick="girisYap('soganlik', '2026', 'sube.html?ad=Soganlik')" style="background: #fffbeb; color: #78350f; border: 1px solid #fde68a; border-radius: 10px; padding: 10px; font-size: 12px; font-weight: bold; cursor: pointer;">
                📍 Soğanlık Şubesi
            </button>

            <!-- Ortadağ Şubesi -->
            <button onclick="girisYap('ortadag', '2027', 'sube.html?ad=Ortadag')" style="background: #fffbeb; color: #78350f; border: 1px solid #fde68a; border-radius: 10px; padding: 10px; font-size: 12px; font-weight: bold; cursor: pointer;">
                📍 Ortadağ Şubesi
            </button>

        </div>
        
    </div>

    <script>
        function girisYap(birim, dogruSifre, hedefSayfa) {
            let sifre = prompt(birim.toUpperCase() + ' birimi için şifreyi giriniz:');
            
            if (sifre === null) return; // İptal basıldıysa

            if (sifre === dogruSifre) {
                if (birim === 'merkez') {
                    sessionStorage.setItem('merkez_auth', 'true');
                } else {
                    sessionStorage.setItem('sube_auth_' + (birim === 'kurtkoy' ? 'Kurtkoy' : birim === 'soganlik' ? 'Soganlik' : 'Ortadag'), 'true');
                }
                window.location.href = hedefSayfa;
            } else {
                alert('Hatalı şifre! Lütfen tekrar deneyin.');
            }
        }
    </script>
</body>
</html>
