<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sweet Waffle - Şube Paneli</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#78350f">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; -webkit-text-size-adjust: 100%; }
        html, body { width: 100%; max-width: 100vw; overflow-x: hidden; margin: 0; padding: 0; background-color: #f9fafb; }
        input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }
    </style>
</head>
<body class="font-sans pb-10">
    <div style="width: 100%; max-width: 100%; margin: 0 auto; padding: 8px;">
        
        <!-- Üst Header -->
        <header style="background: #fff; border: 1px solid #fcd34d; border-radius: 12px; padding: 10px; margin-bottom: 12px; box-shadow: 0 1px 2px rgba(0,0,0,0.05);">
            <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; flex-wrap: wrap; gap: 8px;">
                <div style="display: flex; align-items: center; gap: 8px;">
                    <div style="width: 36px; height: 36px; background: #fffbeb; border: 1px solid #78350f; border-radius: 8px; display: flex; align-items: center; justify-content: center; overflow: hidden; flex-shrink: 0;">
                        <img src="logo.webp" alt="Logo" style="width: 100%; height: 100%; object-fit: contain;" onerror="this.style.display='none'; document.getElementById('subeLogoFallback').style.display='flex';">
                        <div id="subeLogoFallback" style="width: 100%; height: 100%; background: #78350f; color: #fff; font-weight: bold; font-size: 8px; display: none; align-items: center; justify-content: center;">LOGO</div>
                    </div>
                    <div>
                        <h1 id="branchTitle" style="font-size: 13px; font-weight: 900; color: #451a03; margin: 0;">Şube Paneli</h1>
                        <p style="font-size: 9px; color: #6b7280; margin: 0;">Günlük Rapor ve Stok Girişi</p>
                    </div>
                </div>
                
                <div style="display: flex; gap: 4px; flex-wrap: wrap; align-items: center;">
                    <a href="index.html" style="background: #fffbeb; color: #78350f; border: 1px solid #fde68a; padding: 6px 8px; border-radius: 6px; font-size: 10px; font-weight: bold; text-decoration: none;">MERKEZ</a>
                    <a href="sube.html?ad=Kurtkoy" style="background: #78350f; color: #fff; border: 1px solid #78350f; padding: 6px 8px; border-radius: 6px; font-size: 10px; font-weight: bold; text-decoration: none;">Kurtköy</a>
                    <a href="sube.html?ad=Soganlik" style="background: #fffbeb; color: #78350f; border: 1px solid #fde68a; padding: 6px 8px; border-radius: 6px; font-size: 10px; font-weight: bold; text-decoration: none;">Soğanlık</a>
                    <a href="sube.html?ad=Ortadag" style="background: #fffbeb; color: #78350f; border: 1px solid #fde68a; padding: 6px 8px; border-radius: 6px; font-size: 10px; font-weight: bold; text-decoration: none;">Ortadağ</a>
                </div>
            </div>
        </header>

        <!-- Günlük Rapor Formu -->
        <div style="background: #fff; border: 1px solid #fde68a; border-radius: 12px; padding: 12px; margin-bottom: 12px; box-shadow: 0 1px 2px rgba(0,0,0,0.05);">
            <h3 style="font-size: 11px; font-weight: bold; color: #78350f; margin: 0 0 8px 0; text-transform: uppercase;">Günlük Rapor Girişi</h3>
            <form id="reportForm" style="display: flex; flex-direction: column; gap: 8px;">
                <div>
                    <label style="font-size: 9px; color: #6b7280; font-weight: bold;">Tarih</label>
                    <input type="date" id="reportDate" required style="width: 100%; border: 1px solid #d1d5db; border-radius: 6px; padding: 6px; font-size: 11px; background: #fff;">
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
                    <div>
                        <label style="font-size: 9px; color: #6b7280; font-weight: bold;">Nakit</label>
                        <input type="number" step="any" id="cashInput" placeholder="0" style="width: 100%; border: 1px solid #d1d5db; border-radius: 6px; padding: 6px; font-size: 11px;">
                    </div>
                    <div>
                        <label style="font-size: 9px; color: #6b7280; font-weight: bold;">Banka / Kredi Kartı</label>
                        <input type="number" step="any" id="bankInput" placeholder="0" style="width: 100%; border: 1px solid #d1d5db; border-radius: 6px; padding: 6px; font-size: 11px;">
                    </div>
                </div>

                <!-- Yemek Kartları Platformları -->
                <div style="background: #fffbeb; border: 1px solid #fde68a; border-radius: 8px; padding: 8px;">
                    <label style="font-size: 10px; font-weight: bold; color: #78350f; display: block; margin-bottom: 6px;">Yemek Kartları Platformları</label>
                    <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px;">
                        <div>
                            <span style="font-size: 8px; color: #6b7280;">Pluxee</span>
                            <input type="number" step="any" id="platformPluxee" placeholder="0" style="width: 100%; border: 1px solid #d1d5db; border-radius: 4px; padding: 4px; font-size: 10px; background: #fff;">
                        </div>
                        <div>
                            <span style="font-size: 8px; color: #6b7280;">Edenred</span>
                            <input type="number" step="any" id="platformEdenred" placeholder="0" style="width: 100%; border: 1px solid #d1d5db; border-radius: 4px; padding: 4px; font-size: 10px; background: #fff;">
                        </div>
                        <div>
                            <span style="font-size: 8px; color: #6b7280;">MultiNet</span>
                            <input type="number" step="any" id="platformMultiNet" placeholder="0" style="width: 100%; border: 1px solid #d1d5db; border-radius: 4px; padding: 4px; font-size: 10px; background: #fff;">
                        </div>
                        <div>
                            <span style="font-size: 8px; color: #6b7280;">Setcard</span>
                            <input type="number" step="any" id="platformSetcard" placeholder="0" style="width: 100%; border: 1px solid #d1d5db; border-radius: 4px; padding: 4px; font-size: 10px; background: #fff;">
                        </div>
                        <div>
                            <span style="font-size: 8px; color: #6b7280;">MetropolCard</span>
                            <input type="number" step="any" id="platformMetropol" placeholder="0" style="width: 100%; border: 1px solid #d1d5db; border-radius: 4px; padding: 4px; font-size: 10px; background: #fff;">
                        </div>
                        <div>
                            <span style="font-size: 8px; color: #6b7280;">TokenFlex</span>
                            <input type="number" step="any" id="platformToken" placeholder="0" style="width: 100%; border: 1px solid #d1d5db; border-radius: 4px; padding: 4px; font-size: 10px; background: #fff;">
                        </div>
                    </div>
                </div>

                <div style="background: #fdf2f8; border: 1px solid #fbcfe8; border-radius: 8px; padding: 8px;">
                    <div style="display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 4px; margin-bottom: 4px;">
                        <span style="font-size: 8px; color: #db2777; font-weight: bold;">STOK / ÜRÜN</span>
                        <span style="font-size: 8px; color: #db2777; font-weight: bold;">MİKTAR</span>
                        <span style="font-size: 8px; color: #db2777; font-weight: bold;">TUTAR (TL)</span>
                    </div>
                    <div style="display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 4px;">
                        <input type="text" id="stockItem" placeholder="Ürün Adı" style="border: 1px solid #d1d5db; border-radius: 4px; padding: 4px; font-size: 10px; background: #fff;">
                        <input type="number" step="any" id="stockQty" placeholder="Miktar" style="border: 1px solid #d1d5db; border-radius: 4px; padding: 4px; font-size: 10px; background: #fff;">
                        <input type="number" step="any" id="stockAmount" placeholder="Tutar" style="border: 1px solid #d1d5db; border-radius: 4px; padding: 4px; font-size: 10px; background: #fff;">
                    </div>
                </div>

                <div>
                    <label style="font-size: 9px; color: #6b7280; font-weight: bold;">Masraf</label>
                    <input type="number" step="any" id="expenseInput" placeholder="0" style="width: 100%; border: 1px solid #d1d5db; border-radius: 6px; padding: 6px; font-size: 11px;">
                </div>

                <button type="submit" style="background: #78350f; color: #fff; border: none; padding: 10px; border-radius: 6px; font-weight: bold; font-size: 11px; cursor: pointer; margin-top: 4px;">RAPORU KAYDET</button>
            </form>
        </div>

        <!-- Şube Geçmiş Raporlar -->
        <div style="background: #fff; border: 1px solid #fde68a; border-radius: 12px; padding: 12px; box-shadow: 0 1px 2px rgba(0,0,0,0.05);">
            <h3 style="font-size: 11px; font-weight: bold; color: #78350f; margin: 0 0 8px 0; text-transform: uppercase;">Geçmiş Raporlarım</h3>
            <div style="width: 100%; overflow-x: auto;">
                <table style="width: 100%; min-width: 600px; border-collapse: collapse; font-size: 10px;">
                    <thead>
                        <tr style="background: #fffbeb; color: #78350f;">
                            <th style="padding: 6px; text-align: left; font-weight: 600;">TARİH</th>
                            <th style="padding: 6px; text-align: left; font-weight: 600;">NAKİT</th>
                            <th style="padding: 6px; text-align: left; font-weight: 600;">BANKA</th>
                            <th style="padding: 6px; text-align: left; font-weight: 600;">YEMEK KARTLARI</th>
                            <th style="padding: 6px; text-align: left; font-weight: 600;">CİRO</th>
                            <th style="padding: 6px; text-align: left; font-weight: 600;">MASRAF</th>
                        </tr>
                    </thead>
                    <tbody id="branchReportsTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        let branch = urlParams.get('ad') || 'Kurtkoy';
        
        // Şubelere Göre Şifre Kontrolü
        let branchPasswords = {
            'Merkez': '1985',
            'Kurtkoy': '2025',
            'Soganlik': '2026',
            'Ortadag': '2027'
        };

        let branchNamesTr = {
            'Merkez': 'Merkez',
            'Kurtkoy': 'Kurtköy',
            'Soganlik': 'Soğanlık',
            'Ortadag': 'Ortadağ'
        };

        function checkBranchPassword() {
            let authKey = 'sube_auth_' + branch;
            let savedAuth = sessionStorage.getItem(authKey);
            let expectedPass = branchPasswords[branch] || '2025';
            let niceName = branchNamesTr[branch] || branch;

            if (savedAuth !== 'true') {
                let pass = prompt(niceName + ' Şubesinin Şifresini Girin:');
                if (pass === expectedPass) {
                    sessionStorage.setItem(authKey, 'true');
                } else {
                    alert('Hatalı şifre!');
                    window.location.href = 'index.html';
                }
            }
        }
        checkBranchPassword();

        document.getElementById('branchTitle').innerText = (branchNamesTr[branch] || branch) + ' Şube Paneli';
        document.getElementById('reportDate').valueAsDate = new Date();

        const SUPABASE_URL = 'https://yatgnoiybbjvmreikeqs.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_8BxYi7oOUnHvkHAJQNaitQ_kKlHk_Y_'; 
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function formatMoney(val) {
            if (val === null || val === undefined || val === '') return '0';
            let num = Number(val);
            if (isNaN(num)) return '0';
            return num.toLocaleString('tr-TR', { maximumFractionDigits: 2 });
        }

        async function fetchBranchReports() {
            try {
                const { data, error } = await supabaseClient
                    .from('reports')
                    .select('*')
                    .eq('branch', branch)
                    .order('date', { ascending: false });

                if (error) throw error;

                const tbody = document.getElementById('branchReportsTableBody');
                tbody.innerHTML = '';

                if (data && data.length > 0) {
                    data.forEach(row => {
                        const rawC = Number(row.cash) || 0;
                        const rawB = Number(row.bank) || 0;
                        const pPluxee = Number(row.platform_pluxee) || 0;
                        const pEdenred = Number(row.platform_edenred) || 0;
                        const pMultiNet = Number(row.platform_multinet) || 0;
                        const pSetcard = Number(row.platform_setcard) || 0;
                        const pMetropol = Number(row.platform_metropol) || 0;
                        const pToken = Number(row.platform_token) || 0;

                        const rowPlatformTotal = pPluxee + pEdenred + pMultiNet + pSetcard + pMetropol + pToken;
                        const rawR = rawC + rawB;
                        const rawE = Number(row.expense) || 0;

                        const tr = document.createElement('tr');
                        tr.style.borderBottom = '1px solid #f3f4f6';
                        tr.innerHTML = `
                            <td style="padding: 6px; color: #4b5563;">${row.date || '-'}</td>
                            <td style="padding: 6px; color: #1f2937;">${formatMoney(rawC)}</td>
                            <td style="padding: 6px; color: #1f2937;">${formatMoney(rawB)}</td>
                            <td style="padding: 6px; color: #047857;">${formatMoney(rowPlatformTotal)}</td>
                            <td style="padding: 6px; font-weight: bold; color: #b45309;">${formatMoney(rawR)}</td>
                            <td style="padding: 6px; color: #dc2626;">${formatMoney(rawE)}</td>
                        `;
                        tbody.appendChild(tr);
                    });
                } else {
                    tbody.innerHTML = `<tr><td colspan="6" style="padding: 12px; text-align: center; color: #9ca3af;">Henüz rapor girilmemiş.</td></tr>`;
                }
            } catch (err) {
                console.error('Veri çekme hatası:', err);
            }
        }

        document.getElementById('reportForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const payload = {
                branch: branch,
                date: document.getElementById('reportDate').value,
                cash: parseFloat(document.getElementById('cashInput').value) || 0,
                bank: parseFloat(document.getElementById('bankInput').value) || 0,
                platform_pluxee: parseFloat(document.getElementById('platformPluxee').value) || 0,
                platform_edenred: parseFloat(document.getElementById('platformEdenred').value) || 0,
                platform_multinet: parseFloat(document.getElementById('platformMultiNet').value) || 0,
                platform_setcard: parseFloat(document.getElementById('platformSetcard').value) || 0,
                platform_metropol: parseFloat(document.getElementById('platformMetropol').value) || 0,
                platform_token: parseFloat(document.getElementById('platformToken').value) || 0,
                stock_item: document.getElementById('stockItem').value.trim() || 'EMPTY',
                stock_qty: parseFloat(document.getElementById('stockQty').value) || 0,
                stock_amount: parseFloat(document.getElementById('stockAmount').value) || 0,
                stock_unit: '',
                expense: parseFloat(document.getElementById('expenseInput').value) || 0,
                expense_desc: 'EMPTY'
            };

            try {
                const { error } = await supabaseClient.from('reports').insert([payload]);
                if (error) throw error;
                alert('Rapor başarıyla kaydedildi!');
                document.getElementById('reportForm').reset();
                document.getElementById('reportDate').valueAsDate = new Date();
                fetchBranchReports();
            } catch (err) {
                alert('Kayıt başarısız: ' + err.message);
            }
        });

        fetchBranchReports();
    </script>
</body>
</html>
