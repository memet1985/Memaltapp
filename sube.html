<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title id="pageTitle">Şube Paneli</title>
    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#78350f">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* iPhone taşma önleyici kesin çözümler */
        * { box-sizing: border-box; }
        body { width: 100vw; max-width: 100vw; overflow-x: hidden; margin: 0; padding: 0; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen font-sans pb-10">
    <div class="w-full px-2.5 py-3 max-w-2xl mx-auto">
        
        <!-- Üst Header & Şube Geçişleri -->
        <header class="bg-white border border-amber-300 rounded-xl shadow-sm p-3 mb-4">
            <div class="flex items-center justify-between gap-2 mb-3">
                <div class="flex items-center gap-2">
                    <div class="w-10 h-10 bg-amber-50 rounded-lg flex items-center justify-center border border-amber-800 shadow-inner overflow-hidden p-0.5 flex-shrink-0">
                        <img src="logo.webp" alt="Logo" class="w-full h-full object-contain" onerror="this.style.display='none'; document.getElementById('subeLogoFallback').style.display='flex';">
                        <div id="subeLogoFallback" class="w-full h-full bg-amber-900 text-white font-bold text-[8px] items-center justify-center text-center hidden">LOGO</div>
                    </div>
                    <div>
                        <h1 class="text-sm font-black text-amber-950 truncate" id="headerTitle">Şube Paneli</h1>
                        <p class="text-[10px] text-gray-500">Veri Girişi</p>
                    </div>
                </div>
                
                <a href="index.html" class="bg-amber-900 text-white px-2.5 py-1.5 rounded-lg text-[11px] font-bold shadow-sm border border-amber-700 flex items-center gap-1">
                    <span class="w-1.5 h-1.5 rounded-full bg-amber-300 animate-pulse"></span> MERKEZ
                </a>
            </div>

            <!-- Şube Butonları (Mobilde yan yana sığacak şekilde küçültüldü) -->
            <div class="grid grid-cols-3 gap-1.5 pt-1 border-t border-amber-100">
                <a href="sube.html?ad=Kurtkoy" class="branch-btn text-center bg-amber-50 hover:bg-amber-100 text-amber-900 py-1.5 rounded-lg text-[11px] font-semibold border border-amber-200 transition" data-branch="Kurtkoy">Kurtköy</a>
                <a href="sube.html?ad=Soganlik" class="branch-btn text-center bg-amber-50 hover:bg-amber-100 text-amber-900 py-1.5 rounded-lg text-[11px] font-semibold border border-amber-200 transition" data-branch="Soganlik">Soğanlık</a>
                <a href="sube.html?ad=Ortadag" class="branch-btn text-center bg-amber-50 hover:bg-amber-100 text-amber-900 py-1.5 rounded-lg text-[11px] font-semibold border border-amber-200 transition" data-branch="Ortadag">Ortadağ</a>
            </div>
        </header>

        <!-- Veri Giriş Formu -->
        <div class="bg-white rounded-xl border border-amber-200 shadow-sm p-3 mb-4">
            <h3 class="text-xs font-bold text-amber-900 mb-2.5 pb-1.5 border-b border-amber-100 uppercase tracking-wide">Yeni Rapor Ekle</h3>
            
            <form id="reportForm" class="space-y-2.5">
                <div>
                    <label class="block text-[11px] font-semibold text-gray-700 mb-0.5">Tarih:</label>
                    <input type="date" id="date" class="w-full rounded-lg border border-amber-200 p-2 text-xs text-gray-800 bg-white" required>
                </div>

                <div>
                    <label class="block text-[11px] font-semibold text-amber-900 mb-1">Ciro Bilgileri (TL)</label>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <input type="number" step="0.01" id="cash" value="0" placeholder="Nakit" class="clear-zero w-full rounded-lg border border-amber-200 p-2 text-xs bg-white">
                            <span class="text-[9px] text-gray-500 ml-0.5">Nakit</span>
                        </div>
                        <div>
                            <input type="number" step="0.01" id="bank" value="0" placeholder="Banka" class="clear-zero w-full rounded-lg border border-amber-200 p-2 text-xs bg-white">
                            <span class="text-[9px] text-gray-500 ml-0.5">Banka / Kart</span>
                        </div>
                    </div>
                </div>

                <div>
                    <label class="block text-[11px] font-semibold text-amber-900 mb-1">Masraf (Opsiyonel)</label>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <input type="number" step="0.01" id="expense" value="0" placeholder="Tutar" class="clear-zero w-full rounded-lg border border-amber-200 p-2 text-xs bg-white">
                            <span class="text-[9px] text-gray-500 ml-0.5">Tutar (TL)</span>
                        </div>
                        <div>
                            <input type="text" id="expenseDesc" placeholder="Açıklama" class="w-full rounded-lg border border-amber-200 p-2 text-xs bg-white">
                            <span class="text-[9px] text-gray-500 ml-0.5">Açıklama</span>
                        </div>
                    </div>
                </div>

                <div>
                    <label class="block text-[11px] font-semibold text-amber-900 mb-1">Stok (Opsiyonel)</label>
                    <div class="grid grid-cols-2 gap-2 mb-2">
                        <select id="stockItemSelect" class="w-full rounded-lg border border-amber-200 p-2 text-xs bg-white">
                            <option value="">-- Ürün Seç --</option>
                            <option value="Waffle Hamuru">Waffle Hamuru</option>
                            <option value="Çikolata Sosu">Çikolata Sosu</option>
                            <option value="Muz / Çilek">Muz / Çilek</option>
                            <option value="Kutu / Ambalaj">Kutu / Ambalaj</option>
                        </select>
                        <select id="stockUnit" class="w-full rounded-lg border border-amber-200 p-2 text-xs bg-white">
                            <option value="KG">KG</option>
                            <option value="Adet">Adet</option>
                            <option value="Paket">Paket</option>
                            <option value="Lt">Lt</option>
                        </select>
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <input type="number" step="0.01" id="stockQty" value="0" placeholder="Miktar" class="clear-zero w-full rounded-lg border border-amber-200 p-2 text-xs bg-white">
                            <span class="text-[9px] text-gray-500 ml-0.5">Miktar</span>
                        </div>
                        <div>
                            <input type="number" step="0.01" id="stockAmount" value="0" placeholder="Tutar" class="clear-zero w-full rounded-lg border border-amber-200 p-2 text-xs bg-white">
                            <span class="text-[9px] text-gray-500 ml-0.5">Tutar (TL)</span>
                        </div>
                    </div>
                </div>

                <div class="pt-1">
                    <button type="submit" class="w-full bg-amber-900 hover:bg-amber-800 text-white font-bold py-2.5 px-4 rounded-lg shadow text-xs">
                        Kaydet
                    </button>
                </div>
            </form>
        </div>

        <!-- Geçmiş Raporlar -->
        <div class="bg-white rounded-xl border border-amber-200 shadow-sm p-3">
            <h3 class="text-xs font-bold text-amber-900 mb-2 uppercase tracking-wide">Geçmiş Kayıtlar</h3>
            <div class="w-full overflow-x-auto">
                <table class="w-full min-w-[480px] divide-y divide-amber-100 text-[11px]">
                    <thead>
                        <tr class="bg-amber-50 text-amber-900">
                            <th class="p-2 text-left font-semibold">Tarih</th>
                            <th class="p-2 text-left font-semibold">Nakit</th>
                            <th class="p-2 text-left font-semibold">Banka</th>
                            <th class="p-2 text-left font-semibold">Ciro</th>
                            <th class="p-2 text-left font-semibold">Masraf</th>
                            <th class="p-2 text-left font-semibold">Stok</th>
                        </tr>
                    </thead>
                    <tbody id="reportTableBody" class="divide-y divide-gray-100 bg-white"></tbody>
                    <tfoot id="reportTableFooter" class="bg-amber-50/90 font-bold border-t border-amber-200"></tfoot>
                </table>
            </div>
        </div>
    </div>

    <script>
        document.querySelectorAll('.clear-zero').forEach(input => {
            input.addEventListener('focus', function() {
                if (this.value === '0' || this.value === '0.00') this.value = '';
            });
            input.addEventListener('blur', function() {
                if (this.value.trim() === '') this.value = '0';
            });
        });

        const urlParams = new URLSearchParams(window.location.search);
        const currentBranch = urlParams.get('ad') || 'Kurtkoy';

        document.getElementById('pageTitle').innerText = `Sweet Waffle - ${currentBranch}`;
        document.getElementById('headerTitle').innerText = `${currentBranch} Şubesi`;

        document.querySelectorAll('.branch-btn').forEach(btn => {
            if (btn.getAttribute('data-branch') === currentBranch) {
                btn.className = "branch-btn text-center bg-amber-900 text-white py-1.5 rounded-lg text-[11px] font-bold shadow border border-amber-950";
            }
        });

        const SUPABASE_URL = 'https://yatgnoiybbjvmreikeqs.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_8BxYi7oOUnHvkHAJQNaitQ_kKlHk_Y_'; 
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function setTodayDate() {
            const tzOffset = new Date().getTimezoneOffset() * 60000;
            const localISOTime = new Date(Date.now() - tzOffset).toISOString().split('T')[0];
            document.getElementById('date').value = localISOTime;
        }
        setTodayDate();

        async function fetchBranchReports() {
            try {
                const { data, error } = await supabaseClient.from('reports').select('*').order('date', { ascending: false });
                if (error) throw error;
                
                const filteredData = (data || []).filter(row => 
                    row.branch && row.branch.trim().toLowerCase() === currentBranch.trim().toLowerCase()
                );
                
                const tbody = document.getElementById('reportTableBody');
                const tfoot = document.getElementById('reportTableFooter');
                tbody.innerHTML = '';
                tfoot.innerHTML = '';

                let totalCash = 0, totalBank = 0, totalRevenue = 0, totalExpense = 0, totalStock = 0;

                if (filteredData.length > 0) {
                    filteredData.forEach(row => {
                        const c = parseFloat(row.cash) || 0;
                        const b = parseFloat(row.bank) || 0;
                        const r = c + b;
                        const e = parseFloat(row.expense) || 0;
                        const s = parseFloat(row.stock_amount) || 0;

                        totalCash += c; totalBank += b; totalRevenue += r; totalExpense += e; totalStock += s;

                        const tr = document.createElement('tr');
                        tr.className = "hover:bg-amber-50/40";
                        tr.innerHTML = `
                            <td class="p-2 text-gray-600">${row.date}</td>
                            <td class="p-2 text-gray-800">${c.toFixed(2)}</td>
                            <td class="p-2 text-gray-800">${b.toFixed(2)}</td>
                            <td class="p-2 font-bold text-amber-700">${r.toFixed(2)}</td>
                            <td class="p-2 text-red-600">${e.toFixed(2)}</td>
                            <td class="p-2 text-amber-900">${s.toFixed(2)}</td>
                        `;
                        tbody.appendChild(tr);
                    });

                    tfoot.innerHTML = `
                        <tr>
                            <td class="p-2 text-amber-950 uppercase font-extrabold">TOPLAM:</td>
                            <td class="p-2 text-gray-900">${totalCash.toFixed(2)}</td>
                            <td class="p-2 text-gray-900">${totalBank.toFixed(2)}</td>
                            <td class="p-2 text-amber-800 font-extrabold">${totalRevenue.toFixed(2)}</td>
                            <td class="p-2 text-red-700 font-bold">${totalExpense.toFixed(2)}</td>
                            <td class="p-2 text-amber-950 font-bold">${totalStock.toFixed(2)}</td>
                        </tr>
                    `;
                } else {
                    tbody.innerHTML = `<tr><td colspan="6" class="p-4 text-center text-gray-400">Kayıt yok.</td></tr>`;
                }
            } catch (err) { console.error('Hata:', err); }
        }

        document.getElementById('reportForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const payload = {
                branch: currentBranch,
                date: document.getElementById('date').value,
                cash: parseFloat(document.getElementById('cash').value) || 0,
                bank: parseFloat(document.getElementById('bank').value) || 0,
                expense: parseFloat(document.getElementById('expense').value) || 0,
                expense_desc: document.getElementById('expenseDesc').value,
                stock_item: document.getElementById('stockItemSelect').value,
                stock_qty: parseFloat(document.getElementById('stockQty').value) || 0,
                stock_unit: document.getElementById('stockUnit').value,
                stock_amount: parseFloat(document.getElementById('stockAmount').value) || 0
            };

            try {
                const { error } = await supabaseClient.from('reports').insert([payload]);
                if (error) throw error;
                
                alert('Kayıt başarıyla eklendi!');
                document.getElementById('reportForm').reset();
                setTodayDate();
                document.querySelectorAll('.clear-zero').forEach(i => i.value = '0');
                fetchBranchReports();
            } catch (err) { alert('Kayıt yapılamadı: ' + err.message); }
        });

        fetchBranchReports();
    </script>
</body>
</html>
