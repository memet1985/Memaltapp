<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sweet Waffle - Şube Yönetim Paneli</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#78350f">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; -webkit-text-size-adjust: 100%; }
        html, body { width: 100%; max-width: 100vw; overflow-x: hidden; margin: 0; padding: 0; background-color: #f9fafb; }
        input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }
    </style>
</head>
<body class="font-sans pb-10">
    <div style="width: 100%; max-width: 100%; margin: 0 auto; padding: 8px;">
        
        <!-- Üst Header -->
        <header style="background: #fff; border: 1px solid #fcd34d; border-radius: 12px; padding: 10px; margin-bottom: 12px; box-shadow: 0 1px 2px rgba(0,0,0,0.05);">
            <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; flex-wrap: wrap; gap: 8px;">
                <div style="display: flex; align-items: center; gap: 8px;">
                    <div style="width: 36px; height: 36px; background: #fffbeb; border: 1px solid #78350f; border-radius: 8px; display: flex; align-items: center; justify-content: center; overflow: hidden; flex-shrink: 0;">
                        <img src="logo.webp" alt="Logo" style="width: 100%; height: 100%; object-fit: contain;" onerror="this.style.display='none'; document.getElementById('subeLogoFallback').style.display='flex';">
                        <div id="subeLogoFallback" style="width: 100%; height: 100%; background: #78350f; color: #fff; font-weight: bold; font-size: 8px; display: none; align-items: center; justify-content: center;">LOGO</div>
                    </div>
                    <div>
                        <h1 id="branchTitle" style="font-size: 13px; font-weight: 900; color: #451a03; margin: 0;">Şube Paneli</h1>
                        <p style="font-size: 9px; color: #6b7280; margin: 0;">Günlük Rapor Girişi</p>
                    </div>
                </div>
                
                <div style="display: flex; gap: 4px; flex-wrap: wrap;">
                    <a href="index.html" style="background: #fffbeb; color: #78350f; border: 1px solid #fde68a; padding: 6px 8px; border-radius: 6px; font-size: 10px; font-weight: bold; text-decoration: none;">MERKEZ</a>
                    <a href="sube.html?ad=Kurtkoy" style="background: #78350f; color: #fff; border: 1px solid #78350f; padding: 6px 8px; border-radius: 6px; font-size: 10px; font-weight: bold; text-decoration: none;">Kurtköy</a>
                    <a href="sube.html?ad=Soganlik" style="background: #78350f; color: #fff; border: 1px solid #78350f; padding: 6px 8px; border-radius: 6px; font-size: 10px; font-weight: bold; text-decoration: none;">Soğanlık</a>
                    <a href="sube.html?ad=Ortadag" style="background: #78350f; color: #fff; border: 1px solid #78350f; padding: 6px 8px; border-radius: 6px; font-size: 10px; font-weight: bold; text-decoration: none;">Ortadağ</a>
                </div>
            </div>
        </header>

        <!-- Veri Giriş Formu -->
        <div style="background: #fff; border: 1px solid #fde68a; border-radius: 12px; padding: 12px; margin-bottom: 12px; box-shadow: 0 1px 2px rgba(0,0,0,0.05);">
            <h3 style="font-size: 11px; font-weight: bold; color: #78350f; margin: 0 0 10px 0; text-transform: uppercase;">Yeni Günlük Rapor Ekle</h3>
            <form id="reportForm" onsubmit="saveReport(event)">
                <div style="margin-bottom: 8px;">
                    <label style="font-size: 9px; color: #6b7280; font-weight: bold;">Tarih</label>
                    <input type="date" id="reportDate" required style="width: 100%; padding: 6px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 11px;">
                </div>
                <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 8px;">
                    <div>
                        <label style="font-size: 9px; color: #6b7280; font-weight: bold;">Nakit</label>
                        <input type="number" id="cash" step="any" placeholder="0" style="width: 100%; padding: 6px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 11px;">
                    </div>
                    <div>
                        <label style="font-size: 9px; color: #6b7280; font-weight: bold;">Banka / Kredi Kartı</label>
                        <input type="number" id="bank" step="any" placeholder="0" style="width: 100%; padding: 6px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 11px;">
                    </div>
                </div>

                <!-- Yemek Kartları / Platformlar Giriş Alanı -->
                <div style="background: #fffbeb; padding: 8px; border-radius: 8px; border: 1px solid #fde68a; margin-bottom: 8px;">
                    <label style="font-size: 9px; font-weight: bold; color: #78350f; display: block; margin-bottom: 4px;">Yemek Kartları / Platformlar</label>
                    <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px;">
                        <div>
                            <label style="font-size: 8px; color: #6b7280;">Pluxee</label>
                            <input type="number" id="platform_pluxee" step="any" placeholder="0" style="width: 100%; padding: 5px; border: 1px solid #d1d5db; border-radius: 4px; font-size: 10px;">
                        </div>
                        <div>
                            <label style="font-size: 8px; color: #6b7280;">Edenred</label>
                            <input type="number" id="platform_edenred" step="any" placeholder="0" style="width: 100%; padding: 5px; border: 1px solid #d1d5db; border-radius: 4px; font-size: 10px;">
                        </div>
                        <div>
                            <label style="font-size: 8px; color: #6b7280;">MultiNet</label>
                            <input type="number" id="platform_multinet" step="any" placeholder="0" style="width: 100%; padding: 5px; border: 1px solid #d1d5db; border-radius: 4px; font-size: 10px;">
                        </div>
                        <div>
                            <label style="font-size: 8px; color: #6b7280;">Setcard</label>
                            <input type="number" id="platform_setcard" step="any" placeholder="0" style="width: 100%; padding: 5px; border: 1px solid #d1d5db; border-radius: 4px; font-size: 10px;">
                        </div>
                        <div>
                            <label style="font-size: 8px; color: #6b7280;">MetropolCard</label>
                            <input type="number" id="platform_metropol" step="any" placeholder="0" style="width: 100%; padding: 5px; border: 1px solid #d1d5db; border-radius: 4px; font-size: 10px;">
                        </div>
                        <div>
                            <label style="font-size: 8px; color: #6b7280;">TokenFlex</label>
                            <input type="number" id="platform_token" step="any" placeholder="0" style="width: 100%; padding: 5px; border: 1px solid #d1d5db; border-radius: 4px; font-size: 10px;">
                        </div>
                    </div>
                </div>

                <div style="margin-bottom: 12px;">
                    <label style="font-size: 9px; color: #6b7280; font-weight: bold;">Masraf</label>
                    <input type="number" id="expense" step="any" placeholder="0" style="width: 100%; padding: 6px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 11px;">
                </div>
                <button type="submit" style="width: 100%; background: #78350f; color: #fff; border: none; padding: 8px; border-radius: 6px; font-size: 11px; font-weight: bold; cursor: pointer;">Raporu Kaydet</button>
            </form>
        </div>

        <!-- Şube Geçmiş Raporlar Tablosu -->
        <div style="background: #fff; border: 1px solid #fde68a; border-radius: 12px; padding: 12px; box-shadow: 0 1px 2px rgba(0,0,0,0.05);">
            <h3 style="font-size: 11px; font-weight: bold; color: #78350f; margin: 0 0 8px 0; text-transform: uppercase;">Şube Geçmiş Raporları</h3>
            <div style="width: 100%; overflow-x: auto;">
                <table style="width: 100%; min-width: 650px; border-collapse: collapse; font-size: 10px;">
                    <thead>
                        <tr style="background: #fffbeb; color: #78350f;">
                            <th style="padding: 6px; text-align: left; font-weight: 600;">TARİH</th>
                            <th style="padding: 6px; text-align: left; font-weight: 600;">NAKİT</th>
                            <th style="padding: 6px; text-align: left; font-weight: 600;">BANKA</th>
                            <th style="padding: 6px; text-align: left; font-weight: 600;">YEMEK KARTLARI</th>
                            <th style="padding: 6px; text-align: left; font-weight: 600;">MASRAF</th>
                        </tr>
                    </thead>
                    <tbody id="branchReportsTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://yatgnoiybbjvmreikeqs.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_8BxYi7oOUnHvkHAJQNaitQ_kKlHk_Y_'; 
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const urlParams = new URLSearchParams(window.location.search);
        let branchParam = urlParams.get('ad') || 'Kurtkoy';

        const branchMap = {
            'Kurtkoy': 'Kurtköy',
            'Soganlik': 'Soğanlık',
            'Ortadag': 'Ortadağ',
            'Kurtköy': 'Kurtköy',
            'Soğanlık': 'Soğanlık',
            'Ortadağ': 'Ortadağ'
        };

        const currentBranchName = branchMap[branchParam] || branchParam;
        document.getElementById('branchTitle').innerText = currentBranchName + ' Şubesi';
        document.getElementById('reportDate').valueAsDate = new Date();

        function formatMoney(val) {
            if (val === null || val === undefined || val === '') return '0';
            let num = Number(val);
            if (isNaN(num)) return '0';
            return num.toLocaleString('tr-TR', { maximumFractionDigits: 2 });
        }

        function cleanVal(val) {
            let num = Number(val);
            return isNaN(num) ? 0 : num;
        }

        async function fetchBranchReports() {
            try {
                const { data, error } = await supabaseClient
                    .from('reports')
                    .select('*')
                    .or(`branch.eq.${currentBranchName},branch.eq.${branchParam}`)
                    .order('date', { ascending: false });

                if (error) throw error;

                const tbody = document.getElementById('branchReportsTableBody');
                tbody.innerHTML = '';

                if (data && data.length > 0) {
                    data.forEach(row => {
                        const c = cleanVal(row.cash);
                        const b = cleanVal(row.bank);
                        const pTotal = cleanVal(row.platform_pluxee) + cleanVal(row.platform_edenred) + 
                                       cleanVal(row.platform_multinet) + cleanVal(row.platform_setcard) + 
                                       cleanVal(row.platform_metropol) + cleanVal(row.platform_token);
                        const e = cleanVal(row.expense);

                        const tr = document.createElement('tr');
                        tr.style.borderBottom = '1px solid #f3f4f6';
                        tr.innerHTML = `
                            <td style="padding: 6px; color: #4b5563;">${row.date || '-'}</td>
                            <td style="padding: 6px; color: #1f2937;">${formatMoney(c)}</td>
                            <td style="padding: 6px; color: #1f2937;">${formatMoney(b)}</td>
                            <td style="padding: 6px; color: #047857;">${formatMoney(pTotal)}</td>
                            <td style="padding: 6px; color: #dc2626;">${formatMoney(e)}</td>
                        `;
                        tbody.appendChild(tr);
                    });
                } else {
                    tbody.innerHTML = `<tr><td colspan="5" style="padding: 12px; text-align: center; color: #9ca3a0;">Bu şubeye ait kayıt bulunmuyor.</td></tr>`;
                }
            } catch (err) {
                console.error('Veri çekme hatası:', err);
            }
        }

        async function saveReport(event) {
            event.preventDefault();

            const date = document.getElementById('reportDate').value;
            const cash = parseFloat(document.getElementById('cash').value) || 0;
            const bank = parseFloat(document.getElementById('bank').value) || 0;
            const platform_pluxee = parseFloat(document.getElementById('platform_pluxee').value) || 0;
            const platform_edenred = parseFloat(document.getElementById('platform_edenred').value) || 0;
            const platform_multinet = parseFloat(document.getElementById('platform_multinet').value) || 0;
            const platform_setcard = parseFloat(document.getElementById('platform_setcard').value) || 0;
            const platform_metropol = parseFloat(document.getElementById('platform_metropol').value) || 0;
            const platform_token = parseFloat(document.getElementById('platform_token').value) || 0;
            const expense = parseFloat(document.getElementById('expense').value) || 0;

            try {
                const { error } = await supabaseClient
                    .from('reports')
                    .insert([{ 
                        branch: currentBranchName, 
                        date, 
                        cash, 
                        bank, 
                        platform_pluxee, 
                        platform_edenred, 
                        platform_multinet, 
                        platform_setcard, 
                        platform_metropol, 
                        platform_token, 
                        expense 
                    }]);

                if (error) throw error;

                alert('Rapor başarıyla kaydedildi.');
                document.getElementById('reportForm').reset();
                document.getElementById('reportDate').valueAsDate = new Date();
                fetchBranchReports();
            } catch (err) {
                alert('Kayıt başarısız: ' + err.message);
            }
        }

        fetchBranchReports();
    </script>
</body>
</html>
