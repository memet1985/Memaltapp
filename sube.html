<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sweet Waffle - Şube Yönetim Paneli</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#78350f">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    
    <style>
        * { box-sizing: border-box; -webkit-text-size-adjust: 100%; }
        html, body { width: 100%; max-width: 100vw; overflow-x: hidden; margin: 0; padding: 0; background-color: #f9fafb; }
        input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }
    </style>
</head>
<body class="font-sans pb-10">
    <div style="width: 100%; max-width: 100%; margin: 0 auto; padding: 8px;">
        
        <!-- Üst Header -->
        <header style="background: #fff; border: 1px solid #fcd34d; border-radius: 12px; padding: 10px; margin-bottom: 12px; box-shadow: 0 1px 2px rgba(0,0,0,0.05);">
            <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; flex-wrap: wrap; gap: 8px;">
                <div style="display: flex; align-items: center; gap: 8px;">
                    <div style="width: 36px; height: 36px; background: #fffbeb; border: 1px solid #78350f; border-radius: 8px; display: flex; align-items: center; justify-content: center; overflow: hidden; flex-shrink: 0;">
                        <img src="logo.webp" alt="Logo" style="width: 100%; height: 100%; object-fit: contain;" onerror="this.style.display='none'; document.getElementById('subeLogoFallback').style.display='flex';">
                        <div id="subeLogoFallback" style="width: 100%; height: 100%; background: #78350f; color: #fff; font-weight: bold; font-size: 8px; display: none; align-items: center; justify-content: center;">LOGO</div>
                    </div>
                    <div>
                        <h1 id="pageTitle" style="font-size: 13px; font-weight: 900; color: #451a03; margin: 0;">Şube Paneli</h1>
                        <p style="font-size: 9px; color: #6b7280; margin: 0;">Günlük Rapor ve İşlem Ekranı</p>
                    </div>
                </div>
                
                <!-- Şubeler Arası Geçiş Navigasyonu -->
                <div style="display: flex; gap: 4px; flex-wrap: wrap; align-items: center;">
                    <a href="index.html" id="navIndex" style="background: #fffbeb; color: #78350f; border: 1px solid #fde68a; padding: 6px 8px; border-radius: 6px; font-size: 10px; font-weight: bold; text-decoration: none;">MERKEZ</a>
                    <a href="sube.html?ad=Kurtkoy" id="navKurtkoy" style="background: #fffbeb; color: #78350f; border: 1px solid #fde68a; padding: 6px 8px; border-radius: 6px; font-size: 10px; font-weight: bold; text-decoration: none;">Kurtköy</a>
                    <a href="sube.html?ad=Soganlik" id="navSoganlik" style="background: #fffbeb; color: #78350f; border: 1px solid #fde68a; padding: 6px 8px; border-radius: 6px; font-size: 10px; font-weight: bold; text-decoration: none;">Soğanlık</a>
                    <a href="sube.html?ad=Ortadag" id="navOrtadag" style="background: #fffbeb; color: #78350f; border: 1px solid #fde68a; padding: 6px 8px; border-radius: 6px; font-size: 10px; font-weight: bold; text-decoration: none;">Ortadağ</a>
                </div>
            </div>
        </header>

        <!-- Çıktı Alma (PDF / Excel) Butonları -->
        <div style="background: #fff; border: 1px solid #fde68a; border-radius: 12px; padding: 8px; margin-bottom: 12px; display: flex; gap: 8px; justify-content: flex-end;">
            <button type="button" onclick="exportToExcel()" style="background: #047857; color: #fff; border: none; padding: 6px 12px; border-radius: 6px; font-size: 10px; font-weight: bold; cursor: pointer;">Excel Çıktısı Al</button>
            <button type="button" onclick="exportToPDF()" style="background: #b91c1c; color: #fff; border: none; padding: 6px 12px; border-radius: 6px; font-size: 10px; font-weight: bold; cursor: pointer;">PDF Çıktısı Al</button>
        </div>

        <!-- Şube Günlük Rapor Giriş Formu -->
        <div style="background: #fff; border: 1px solid #fde68a; border-radius: 12px; padding: 12px; margin-bottom: 12px; box-shadow: 0 1px 2px rgba(0,0,0,0.05);">
            <h3 style="font-size: 11px; font-weight: bold; color: #78350f; margin: 0 0 8px 0; text-transform: uppercase;">Günlük Rapor ve Masraf Girişi</h3>
            <form id="dailyReportForm" style="display: flex; flex-direction: column; gap: 8px;">
                <div>
                    <label style="font-size: 9px; color: #6b7280; font-weight: bold;">Tarih</label>
                    <input type="date" id="reportDate" required style="width: 100%; padding: 6px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 11px;">
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
                    <div>
                        <label style="font-size: 9px; color: #6b7280; font-weight: bold;">Nakit (TL)</label>
                        <input type="number" step="any" id="reportCash" placeholder="0" style="width: 100%; padding: 6px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 11px;">
                    </div>
                    <div>
                        <label style="font-size: 9px; color: #6b7280; font-weight: bold;">Normal Banka / Kredi Kartı</label>
                        <input type="number" step="any" id="reportBank" placeholder="0" style="width: 100%; padding: 6px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 11px;">
                    </div>
                </div>

                <!-- Yemek Kartları Alanı -->
                <div style="background: #fffbeb; border: 1px solid #fde68a; border-radius: 8px; padding: 8px;">
                    <label style="font-size: 9px; font-weight: bold; color: #78350f; display: block; margin-bottom: 4px;">Yemek Kartları Ciro Detayları</label>
                    <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px;">
                        <div>
                            <span style="font-size: 8px; color: #6b7280;">Pluxee</span>
                            <input type="number" step="any" id="platformPluxee" placeholder="0" style="width: 100%; padding: 5px; border: 1px solid #d1d5db; border-radius: 4px; font-size: 10px; background: #fff;">
                        </div>
                        <div>
                            <span style="font-size: 8px; color: #6b7280;">Edenred</span>
                            <input type="number" step="any" id="platformEdenred" placeholder="0" style="width: 100%; padding: 5px; border: 1px solid #d1d5db; border-radius: 4px; font-size: 10px; background: #fff;">
                        </div>
                        <div>
                            <span style="font-size: 8px; color: #6b7280;">MultiNet</span>
                            <input type="number" step="any" id="platformMultiNet" placeholder="0" style="width: 100%; padding: 5px; border: 1px solid #d1d5db; border-radius: 4px; font-size: 10px; background: #fff;">
                        </div>
                        <div>
                            <span style="font-size: 8px; color: #6b7280;">Setcard</span>
                            <input type="number" step="any" id="platformSetcard" placeholder="0" style="width: 100%; padding: 5px; border: 1px solid #d1d5db; border-radius: 4px; font-size: 10px; background: #fff;">
                        </div>
                        <div>
                            <span style="font-size: 8px; color: #6b7280;">MetropolCard</span>
                            <input type="number" step="any" id="platformMetropol" placeholder="0" style="width: 100%; padding: 5px; border: 1px solid #d1d5db; border-radius: 4px; font-size: 10px; background: #fff;">
                        </div>
                        <div>
                            <span style="font-size: 8px; color: #6b7280;">TokenFlex</span>
                            <input type="number" step="any" id="platformToken" placeholder="0" style="width: 100%; padding: 5px; border: 1px solid #d1d5db; border-radius: 4px; font-size: 10px; background: #fff;">
                        </div>
                    </div>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
                    <div>
                        <label style="font-size: 9px; color: #6b7280; font-weight: bold;">Masraf Tutarı (TL)</label>
                        <input type="number" step="any" id="reportExpense" placeholder="0" style="width: 100%; padding: 6px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 11px;">
                    </div>
                    <div>
                        <label style="font-size: 9px; color: #6b7280; font-weight: bold;">Masraf Açıklaması (Ne için?)</label>
                        <input type="text" id="reportExpenseDesc" placeholder="Örn: Su faturası / Pazar alışverişi" style="width: 100%; padding: 6px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 11px;">
                    </div>
                </div>

                <button type="submit" style="width: 100%; background: #78350f; color: #fff; padding: 8px; border-radius: 6px; font-weight: bold; border: none; font-size: 11px; cursor: pointer; margin-top: 4px;">Günlük Raporu Kaydet</button>
            </form>
        </div>

        <!-- Şube Geçmiş Raporlar Tablosu -->
        <div style="background: #fff; border: 1px solid #fde68a; border-radius: 12px; padding: 12px; box-shadow: 0 1px 2px rgba(0,0,0,0.05);">
            <h3 style="font-size: 11px; font-weight: bold; color: #78350f; margin: 0 0 8px 0; text-transform: uppercase;">Şube Geçmiş Raporları</h3>
            <div style="width: 100%; overflow-x: auto;">
                <table style="width: 100%; min-width: 600px; border-collapse: collapse; font-size: 10px;">
                    <thead>
                        <tr style="background: #fffbeb; color: #78350f;">
                            <th style="padding: 6px; text-align: left; font-weight: 600;">TARİH</th>
                            <th style="padding: 6px; text-align: left; font-weight: 600;">NAKİT</th>
                            <th style="padding: 6px; text-align: left; font-weight: 600;">BANKA</th>
                            <th style="padding: 6px; text-align: left; font-weight: 600;">YEMEK KARTLARI</th>
                            <th style="padding: 6px; text-align: left; font-weight: 600;">CİRO</th>
                            <th style="padding: 6px; text-align: left; font-weight: 600;">MASRAF & AÇIKLAMA</th>
                        </tr>
                    </thead>
                    <tbody id="branchReportsTableBody"></tbody>
                    <tfoot id="branchReportsTableFooter" style="background: #fffbeb; font-weight: bold; border-top: 1px solid #fde68a;"></tfoot>
                </table>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://yatgnoiybbjvmreikeqs.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_8BxYi7oOUnHvkHAJQNaitQ_kKlHk_Y_'; 
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const urlParams = new URLSearchParams(window.location.search);
        const branchParam = urlParams.get('ad') || 'Kurtkoy';
        
        let branchDataCache = [];
        document.getElementById('pageTitle').innerText = `${branchParam} Şube Paneli`;
        document.getElementById('reportDate').valueAsDate = new Date();

        const allNavIds = ['navKurtkoy', 'navSoganlik', 'navOrtadag'];
        allNavIds.forEach(id => {
            const btn = document.getElementById(id);
            if (btn) {
                btn.style.background = '#fffbeb';
                btn.style.color = '#78350f';
                btn.style.border = '1px solid #fde68a';
            }
        });

        const activeNavId = 'nav' + branchParam;
        const activeBtn = document.getElementById(activeNavId);
        if (activeBtn) {
            activeBtn.style.background = '#78350f';
            activeBtn.style.color = '#fff';
            activeBtn.style.border = '1px solid #78350f';
        }

        function formatMoney(val) {
            if (val === null || val === undefined || val === '') return '0';
            let num = Number(val);
            if (isNaN(num)) return '0';
            return num.toLocaleString('tr-TR', { maximumFractionDigits: 2 });
        }

        function cleanVal(val) {
            let num = Number(val);
            return isNaN(num) ? 0 : num;
        }

        async function fetchBranchReports() {
            try {
                const { data, error } = await supabaseClient
                    .from('reports')
                    .select('*')
                    .ilike('branch', branchParam)
                    .order('date', { ascending: false });
                
                if (error) throw error;
                branchDataCache = data || [];
                renderBranchReports(branchDataCache);
            } catch (err) { console.error('Hata:', err); }
        }

        document.getElementById('dailyReportForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const date = document.getElementById('reportDate').value;
            const cash = parseFloat(document.getElementById('reportCash').value) || 0;
            const bank = parseFloat(document.getElementById('reportBank').value) || 0;
            
            const pPluxee = parseFloat(document.getElementById('platformPluxee').value) || 0;
            const pEdenred = parseFloat(document.getElementById('platformEdenred').value) || 0;
            const pMultiNet = parseFloat(document.getElementById('platformMultiNet').value) || 0;
            const pSetcard = parseFloat(document.getElementById('platformSetcard').value) || 0;
            const pMetropol = parseFloat(document.getElementById('platformMetropol').value) || 0;
            const pToken = parseFloat(document.getElementById('platformToken').value) || 0;

            const expense = parseFloat(document.getElementById('reportExpense').value) || 0;
            const expenseDesc = document.getElementById('reportExpenseDesc').value;

            const payload = {
                branch: branchParam,
                date: date,
                cash: cash,
                bank: bank,
                platform_pluxee: pPluxee,
                platform_edenred: pEdenred,
                platform_multinet: pMultiNet,
                platform_setcard: pSetcard,
                platform_metropol: pMetropol,
                platform_token: pToken,
                expense: expense,
                expense_desc: expenseDesc
            };

            try {
                const { error } = await supabaseClient.from('reports').insert([payload]);
                if (error) throw error;
                alert('Günlük rapor başarıyla kaydedildi.');
                document.getElementById('dailyReportForm').reset();
                document.getElementById('reportDate').valueAsDate = new Date();
                fetchBranchReports();
            } catch (err) {
                alert('Kayıt başarısız: ' + err.message);
            }
        });

        function renderBranchReports(data) {
            const tbody = document.getElementById('branchReportsTableBody');
            const tfoot = document.getElementById('branchReportsTableFooter');
            tbody.innerHTML = '';
            tfoot.innerHTML = '';

            let totalCash = 0, totalBank = 0, totalPlatforms = 0, totalRevenue = 0, totalExpense = 0;

            if (data.length > 0) {
                data.forEach(row => {
                    const rawC = cleanVal(row.cash);
                    const rawB = cleanVal(row.bank);
                    const pTotal = cleanVal(row.platform_pluxee) + cleanVal(row.platform_edenred) + cleanVal(row.platform_multinet) + cleanVal(row.platform_setcard) + cleanVal(row.platform_metropol) + cleanVal(row.platform_token);
                    const rawR = rawC + rawB;
                    const rawE = cleanVal(row.expense);
                    const expDesc = row.expense_desc ? ` (${row.expense_desc})` : '';

                    totalCash += rawC;
                    totalBank += rawB;
                    totalPlatforms += pTotal;
                    totalRevenue += rawR;
                    totalExpense += rawE;

                    const tr = document.createElement('tr');
                    tr.style.borderBottom = '1px solid #f3f4f6';

                    tr.innerHTML = `
                        <td style="padding: 6px; color: #4b5563;">${row.date || '-'}</td>
                        <td style="padding: 6px; color: #1f2937;">${formatMoney(rawC)}</td>
                        <td style="padding: 6px; color: #1f2937;">${formatMoney(rawB)}</td>
                        <td style="padding: 6px; color: #047857;">${formatMoney(pTotal)}</td>
                        <td style="padding: 6px; font-weight: bold; color: #b45309;">${formatMoney(rawR)}</td>
                        <td style="padding: 6px; color: #dc2626;">${formatMoney(rawE)}${expDesc}</td>
                    `;
                    tbody.appendChild(tr);
                });

                tfoot.innerHTML = `
                    <tr>
                        <td style="padding: 6px; color: #451a03; text-transform: uppercase;">TOPLAM:</td>
                        <td style="padding: 6px; color: #1f2937;">${formatMoney(totalCash)}</td>
                        <td style="padding: 6px; color: #1f2937;">${formatMoney(totalBank)}</td>
                        <td style="padding: 6px; color: #047857;">${formatMoney(totalPlatforms)}</td>
                        <td style="padding: 6px; color: #b45309;">${formatMoney(totalRevenue)}</td>
                        <td style="padding: 6px; color: #dc2626;">${formatMoney(totalExpense)}</td>
                    </tr>
                `;
            } else {
                tbody.innerHTML = `<tr><td colspan="6" style="padding: 12px; text-align: center; color: #9ca3a0;">Kayıt bulunmuyor.</td></tr>`;
            }
        }

        function exportToExcel() {
            let dataToExport = branchDataCache.map(row => {
                const pTotal = cleanVal(row.platform_pluxee) + cleanVal(row.platform_edenred) + cleanVal(row.platform_multinet) + cleanVal(row.platform_setcard) + cleanVal(row.platform_metropol) + cleanVal(row.platform_token);
                return {
                    "Şube": row.branch || '',
                    "Tarih": row.date || '',
                    "Nakit": cleanVal(row.cash),
                    "Banka": cleanVal(row.bank),
                    "Yemek Kartları": pTotal,
                    "Ciro": cleanVal(row.cash) + cleanVal(row.bank),
                    "Masraf": cleanVal(row.expense),
                    "Masraf Açıklaması": row.expense_desc || ''
                };
            });

            const worksheet = XLSX.utils.json_to_sheet(dataToExport);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, `${branchParam}_Raporlari`);
            XLSX.writeFile(workbook, `${branchParam}_SweetWaffle_Raporlar.xlsx`);
        }

        function exportToPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF('landscape');

            doc.setFontSize(14);
            doc.text(`Sweet Waffle - ${branchParam} Sube Raporlari Listesi`, 14, 15);

            let tableRows = branchDataCache.map(row => {
                const pTotal = cleanVal(row.platform_pluxee) + cleanVal(row.platform_edenred) + cleanVal(row.platform_multinet) + cleanVal(row.platform_setcard) + cleanVal(row.platform_metropol) + cleanVal(row.platform_token);
                const ciro = cleanVal(row.cash) + cleanVal(row.bank);
                const expInfo = cleanVal(row.expense) + (row.expense_desc ? ` (${row.expense_desc})` : '');
                return [
                    row.date || '',
                    formatMoney(row.cash),
                    formatMoney(row.bank),
                    formatMoney(pTotal),
                    formatMoney(ciro),
                    expInfo
                ];
            });

            doc.autoTable({
                head: [['Tarih', 'Nakit', 'Banka', 'Yemek Kartı', 'Ciro', 'Masraf & Açıklama']],
                body: tableRows,
                startY: 20,
                styles: { fontSize: 8 }
            });

            doc.save(`${branchParam}_SweetWaffle_Raporlar.pdf`);
        }

        fetchBranchReports();
    </script>
</body>
</html>
