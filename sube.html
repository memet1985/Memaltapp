<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">Şube Paneli</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 min-h-screen font-sans">
    <div class="container mx-auto px-4 py-6 max-w-6xl">
        
        <!-- Üst Header & Şube Geçiş Butonları -->
        <header class="bg-white border border-amber-200 rounded-2xl shadow-sm p-4 mb-6 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="w-12 h-12 bg-amber-100 rounded-full flex items-center justify-center border border-amber-300 overflow-hidden shadow-inner">
                    <span class="text-amber-800 font-bold text-xs">Waffle</span>
                </div>
                <div>
                    <h1 class="text-xl font-bold text-amber-900 tracking-wide" id="headerTitle">Şube Paneli</h1>
                    <p class="text-xs text-gray-500">Sadece bu şubeye ait veri girişi ve geçmiş raporları</p>
                </div>
            </div>
            
            <!-- Şubelere Geçiş Menüsü -->
            <div class="flex flex-wrap gap-2 justify-center">
                <a href="index.html" class="bg-amber-100 hover:bg-amber-200 text-amber-900 px-3 py-2 rounded-xl text-xs font-semibold transition border border-amber-300">Merkez</a>
                <a href="sube.html?ad=Kurtkoy" class="branch-btn bg-amber-100 text-amber-900 px-3 py-2 rounded-xl text-xs font-semibold transition border border-amber-300" data-branch="Kurtkoy">Kurtköy Şube</a>
                <a href="sube.html?ad=Soganlik" class="branch-btn bg-amber-100 text-amber-900 px-3 py-2 rounded-xl text-xs font-semibold transition border border-amber-300" data-branch="Soganlik">Soğanlık Şube</a>
                <a href="sube.html?ad=Ortadag" class="branch-btn bg-amber-100 text-amber-900 px-3 py-2 rounded-xl text-xs font-semibold transition border border-amber-300">Ortadağ Şube</a>
            </div>
        </header>

        <!-- Yeni Veri Giriş Kartı -->
        <div class="bg-white rounded-2xl border border-amber-200 shadow-sm p-6 mb-8">
            <h3 class="text-lg font-bold text-amber-900 mb-4 pb-2 border-b border-amber-100">Şube Veri Girişi</h3>
            
            <form id="reportForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Tarih:</label>
                    <input type="date" id="date" class="w-full md:w-1/3 rounded-xl border border-amber-200 shadow-sm p-2.5 text-gray-800 focus:ring-2 focus:ring-amber-500 focus:outline-none" required>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-amber-900 mb-2">Ciro Bilgileri</label>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-medium text-gray-600 mb-1">Nakit Ciro (TL):</label>
                            <input type="number" step="0.01" id="cash" value="0" class="clear-zero w-full rounded-xl border border-amber-200 shadow-sm p-2.5 focus:ring-2 focus:ring-amber-500 focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-gray-600 mb-1">Banka / Kart (TL):</label>
                            <input type="number" step="0.01" id="bank" value="0" class="clear-zero w-full rounded-xl border border-amber-200 shadow-sm p-2.5 focus:ring-2 focus:ring-amber-500 focus:outline-none">
                        </div>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-amber-900 mb-2">Masraf Ekle (Opsiyonel)</label>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-medium text-gray-600 mb-1">Masraf Tutarı (TL):</label>
                            <input type="number" step="0.01" id="expense" value="0" class="clear-zero w-full rounded-xl border border-amber-200 shadow-sm p-2.5 focus:ring-2 focus:ring-amber-500 focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-gray-600 mb-1">Masraf Açıklaması:</label>
                            <input type="text" id="expenseDesc" placeholder="Örn: Market, kurye ödemesi vs." class="w-full rounded-xl border border-amber-200 shadow-sm p-2.5 focus:ring-2 focus:ring-amber-500 focus:outline-none">
                        </div>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-amber-900 mb-2">Stok Girişi (Opsiyonel)</label>
                    <div class="grid grid-cols-1 md:grid-cols-4 gap-3 items-end">
                        <div>
                            <label class="block text-xs font-medium text-gray-600 mb-1">Ürün / Malzeme Seçin:</label>
                            <select id="stockItemSelect" class="w-full rounded-xl border border-amber-200 shadow-sm p-2.5 focus:ring-2 focus:ring-amber-500 focus:outline-none bg-white">
                                <option value="">-- Ürün Seçin --</option>
                                <option value="Waffle Hamuru">Waffle Hamuru</option>
                                <option value="Çikolata Sosu">Çikolata Sosu</option>
                                <option value="Muz / Çilek">Muz / Çilek</option>
                                <option value="Kutu / Ambalaj">Kutu / Ambalaj</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-gray-600 mb-1">Miktar:</label>
                            <input type="number" step="0.01" id="stockQty" value="0" class="clear-zero w-full rounded-xl border border-amber-200 shadow-sm p-2.5 focus:ring-2 focus:ring-amber-500 focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-gray-600 mb-1">Birim:</label>
                            <select id="stockUnit" class="w-full rounded-xl border border-amber-200 shadow-sm p-2.5 focus:ring-2 focus:ring-amber-500 focus:outline-none bg-white">
                                <option value="KG">KG</option>
                                <option value="Adet">Adet</option>
                                <option value="Paket">Paket</option>
                                <option value="Lt">Lt</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-gray-600 mb-1">Stok Tutarı (TL):</label>
                            <input type="number" step="0.01" id="stockAmount" value="0" class="clear-zero w-full rounded-xl border border-amber-200 shadow-sm p-2.5 focus:ring-2 focus:ring-amber-500 focus:outline-none">
                        </div>
                    </div>
                </div>

                <div class="pt-2">
                    <button type="submit" class="w-full bg-amber-900 hover:bg-amber-800 text-white font-bold py-3.5 px-6 rounded-xl shadow-md transition text-center">
                        Bu Şube İçin Kaydet
                    </button>
                </div>
            </form>
        </div>

        <!-- Tablo -->
        <div class="bg-white rounded-2xl border border-amber-200 shadow-sm p-6">
            <h3 class="text-lg font-bold text-amber-900 mb-4">Şubeye Ait Geçmiş Kayıtlar</h3>
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-amber-100">
                    <thead>
                        <tr class="bg-amber-50">
                            <th class="px-4 py-3 text-left text-xs font-semibold text-amber-900 uppercase">Tarih</th>
                            <th class="px-4 py-3 text-left text-xs font-semibold text-amber-900 uppercase">Nakit</th>
                            <th class="px-4 py-3 text-left text-xs font-semibold text-amber-900 uppercase">Banka</th>
                            <th class="px-4 py-3 text-left text-xs font-semibold text-amber-900 uppercase">Toplam Ciro</th>
                            <th class="px-4 py-3 text-left text-xs font-semibold text-amber-900 uppercase">Masraf</th>
                            <th class="px-4 py-3 text-left text-xs font-semibold text-amber-900 uppercase">Stok Maliyeti</th>
                        </tr>
                    </thead>
                    <tbody id="reportTableBody" class="divide-y divide-gray-100 bg-white text-sm"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // Sayı alanlarına tıklandığında veya odaklanıldığında 0'ı otomatik silme mantığı
        document.querySelectorAll('.clear-zero').forEach(input => {
            input.addEventListener('focus', function() {
                if (this.value === '0' || this.value === '0.00') {
                    this.value = '';
                }
            });
            input.addEventListener('blur', function() {
                if (this.value.trim() === '') {
                    this.value = '0';
                }
            });
        });

        const urlParams = new URLSearchParams(window.location.search);
        const currentBranch = urlParams.get('ad') || 'Kurtkoy';

        document.getElementById('pageTitle').innerText = `Sweet Waffle - ${currentBranch} Şube`;
        document.getElementById('headerTitle').innerText = `${currentBranch} Şubesi Yönetim Paneli`;

        document.querySelectorAll('.branch-btn').forEach(btn => {
            if (btn.getAttribute('data-branch') === currentBranch) {
                btn.className = "branch-btn bg-amber-900 text-white px-3 py-2 rounded-xl text-xs font-semibold shadow";
            }
        });

        const SUPABASE_URL = 'https://yatgnoiybbjvmreikeqs.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_8BxYi7oOUnHvkHAJQNaitQ_kKlHk_Y_'; 
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function getLocalTodayString() {
            const tzOffset = new Date().getTimezoneOffset() * 60000;
            return new Date(Date.now() - tzOffset).toISOString().split('T')[0];
        }
        document.getElementById('date').value = getLocalTodayString();

        async function fetchBranchReports() {
            try {
                const { data, error } = await supabaseClient.from('reports').select('*').order('date', { ascending: false });
                if (error) throw error;
                const filteredData = (data || []).filter(row => 
                    row.branch && row.branch.trim().toLowerCase() === currentBranch.trim().toLowerCase()
                );
                const tbody = document.getElementById('reportTableBody');
                tbody.innerHTML = '';

                if (filteredData.length > 0) {
                    filteredData.forEach(row => {
                        const c = parseFloat(row.cash) || 0;
                        const b = parseFloat(row.bank) || 0;
                        const r = c + b;
                        const e = parseFloat(row.expense) || 0;
                        const s = parseFloat(row.stock_amount) || 0;

                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td class="px-4 py-3 text-gray-600">${row.date}</td>
                            <td class="px-4 py-3 text-gray-800">${c.toFixed(2)} ₺</td>
                            <td class="px-4 py-3 text-gray-800">${b.toFixed(2)} ₺</td>
                            <td class="px-4 py-3 font-semibold text-amber-700">${r.toFixed(2)} ₺</td>
                            <td class="px-4 py-3 text-red-600">${e.toFixed(2)} ₺</td>
                            <td class="px-4 py-3 text-amber-900">${s.toFixed(2)} ₺</td>
                        `;
                        tbody.appendChild(tr);
                    });
                } else {
                    tbody.innerHTML = `<tr><td colspan="6" class="px-4 py-4 text-center text-gray-400">Bu şube için henüz kayıt bulunmuyor.</td></tr>`;
                }
            } catch (err) { console.error(err); }
        }

        document.getElementById('reportForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const payload = {
                branch: currentBranch,
                date: document.getElementById('date').value,
                cash: parseFloat(document.getElementById('cash').value) || 0,
                bank: parseFloat(document.getElementById('bank').value) || 0,
                expense: parseFloat(document.getElementById('expense').value) || 0,
                expense_desc: document.getElementById('expenseDesc').value,
                stock_item: document.getElementById('stockItemSelect').value,
                stock_qty: parseFloat(document.getElementById('stockQty').value) || 0,
                stock_unit: document.getElementById('stockUnit').value,
                stock_amount: parseFloat(document.getElementById('stockAmount').value) || 0
            };

            try {
                const { error } = await supabaseClient.from('reports').insert([payload]);
                if (error) throw error;
                alert(`Veri başarıyla ${currentBranch} şubesi adına kaydedildi!`);
                document.getElementById('reportForm').reset();
                document.getElementById('date').value = getLocalTodayString();
                // Sıfırlama sonrası input değerlerini varsayılan 0'a çek
                document.querySelectorAll('.clear-zero').forEach(i => i.value = '0');
                fetchBranchReports();
            } catch (err) { alert('Kayıt yapılamadı: ' + err.message); }
        });

        fetchBranchReports();
    </script>
</body>
</html>
