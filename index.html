<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sweet Waffle - Merkez Yönetim Paneli</title>
    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#78350f">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; -webkit-text-size-adjust: 100%; }
        html, body { width: 100%; max-width: 100vw; overflow-x: hidden; margin: 0; padding: 0; background-color: #f9fafb; }
    </style>
</head>
<body class="font-sans pb-10">
    <div style="width: 100%; max-width: 480px; margin: 0 auto; padding: 10px;">
        
        <!-- Üst Header -->
        <header style="background: #fff; border: 1px solid #fcd34d; border-radius: 12px; padding: 10px; margin-bottom: 12px; box-shadow: 0 1px 2px rgba(0,0,0,0.05);">
            <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px;">
                <div style="display: flex; align-items: center; gap: 8px;">
                    <div style="width: 36px; height: 36px; background: #fffbeb; border: 1px solid #78350f; border-radius: 8px; display: flex; align-items: center; justify-content: center; overflow: hidden; flex-shrink: 0;">
                        <img src="logo.webp" alt="Logo" style="width: 100%; height: 100%; object-fit: contain;" onerror="this.style.display='none'; document.getElementById('merkezLogoFallback').style.display='flex';">
                        <div id="merkezLogoFallback" style="width: 100%; height: 100%; background: #78350f; color: #fff; font-weight: bold; font-size: 8px; display: none; align-items: center; justify-content: center;">LOGO</div>
                    </div>
                    <div>
                        <h1 style="font-size: 13px; font-weight: 900; color: #451a03; margin: 0;">Merkez Paneli</h1>
                        <p style="font-size: 9px; color: #6b7280; margin: 0;">Genel Durum Raporu</p>
                    </div>
                </div>
                
                <div style="display: flex; gap: 4px;">
                    <a href="sube.html?ad=Kurtkoy" style="background: #fffbeb; color: #78350f; border: 1px solid #fde68a; padding: 6px 8px; border-radius: 6px; font-size: 10px; font-weight: bold; text-decoration: none;">Kurtköy</a>
                    <a href="sube.html?ad=Soganlik" style="background: #fffbeb; color: #78350f; border: 1px solid #fde68a; padding: 6px 8px; border-radius: 6px; font-size: 10px; font-weight: bold; text-decoration: none;">Soğanlık</a>
                    <a href="sube.html?ad=Ortadag" style="background: #fffbeb; color: #78350f; border: 1px solid #fde68a; padding: 6px 8px; border-radius: 6px; font-size: 10px; font-weight: bold; text-decoration: none;">Ortadağ</a>
                </div>
            </div>
        </header>

        <!-- Tüm Şubelerin Genel Raporları -->
        <div style="background: #fff; border: 1px solid #fde68a; border-radius: 12px; padding: 12px; box-shadow: 0 1px 2px rgba(0,0,0,0.05);">
            <h3 style="font-size: 11px; font-weight: bold; color: #78350f; margin: 0 0 8px 0; text-transform: uppercase;">Tüm Şube Kayıtları</h3>
            <div style="width: 100%; overflow-x: auto;">
                <table style="width: 100%; min-width: 520px; border-collapse: collapse; font-size: 10px;">
                    <thead>
                        <tr style="background: #fffbeb; color: #78350f;">
                            <th style="padding: 6px; text-align: left; font-weight: 600;">Şube</th>
                            <th style="padding: 6px; text-align: left; font-weight: 600;">Tarih</th>
                            <th style="padding: 6px; text-align: left; font-weight: 600;">Nakit</th>
                            <th style="padding: 6px; text-align: left; font-weight: 600;">Banka</th>
                            <th style="padding: 6px; text-align: left; font-weight: 600;">Ciro</th>
                            <th style="padding: 6px; text-align: left; font-weight: 600;">Masraf</th>
                            <th style="padding: 6px; text-align: center; font-weight: 600;">İşlem</th>
                        </tr>
                    </thead>
                    <tbody id="allReportsTableBody"></tbody>
                    <tfoot id="allReportsTableFooter" style="background: #fffbeb; font-weight: bold; border-top: 1px solid #fde68a;"></tfoot>
                </table>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://yatgnoiybbjvmreikeqs.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_8BxYi7oOUnHvkHAJQNaitQ_kKlHk_Y_'; 
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function cleanVal(val) {
            if (val === null || val === undefined || val === '') return 0;
            // Eğer veritabanından .00 şeklinde geliyorsa temizle
            let num = Number(val);
            if (isNaN(num)) return 0;
            return num % 1 === 0 ? Math.trunc(num) : num;
        }

        async function fetchAllReports() {
            try {
                const { data, error } = await supabaseClient.from('reports').select('*').order('date', { ascending: false });
                if (error) throw error;
                
                const tbody = document.getElementById('allReportsTableBody');
                const tfoot = document.getElementById('allReportsTableFooter');
                tbody.innerHTML = '';
                tfoot.innerHTML = '';

                let totalCash = 0, totalBank = 0, totalRevenue = 0, totalExpense = 0;

                if (data && data.length > 0) {
                    data.forEach(row => {
                        const c = cleanVal(row.cash);
                        const b = cleanVal(row.bank);
                        const r = c + b;
                        const e = cleanVal(row.expense);

                        totalCash += c; 
                        totalBank += b; 
                        totalRevenue += r; 
                        totalExpense += e;

                        const tr = document.createElement('tr');
                        tr.style.borderBottom = '1px solid #f3f4f6';
                        tr.innerHTML = `
                            <td style="padding: 6px; font-weight: bold; color: #78350f;">${row.branch || '-'}</td>
                            <td style="padding: 6px; color: #4b5563;">${row.date || '-'}</td>
                            <td style="padding: 6px; color: #1f2937;">${c}</td>
                            <td style="padding: 6px; color: #1f2937;">${b}</td>
                            <td style="padding: 6px; font-weight: bold; color: #b45309;">${r}</td>
                            <td style="padding: 6px; color: #dc2626;">${e}</td>
                            <td style="padding: 6px; text-align: center;">
                                <button onclick="deleteReport('${row.id}')" style="background: #fee2e2; color: #b91c1c; border: 1px solid #fca5a5; padding: 3px 6px; border-radius: 4px; font-size: 9px; font-weight: bold; cursor: pointer;">Sil</button>
                            </td>
                        `;
                        tbody.appendChild(tr);
                    });

                    tfoot.innerHTML = `
                        <tr>
                            <td colspan="2" style="padding: 6px; color: #451a03; text-transform: uppercase;">TOPLAM:</td>
                            <td style="padding: 6px; color: #1f2937;">${totalCash}</td>
                            <td style="padding: 6px; color: #1f2937;">${totalBank}</td>
                            <td style="padding: 6px; color: #b45309;">${totalRevenue}</td>
                            <td style="padding: 6px; color: #dc2626;">${totalExpense}</td>
                            <td></td>
                        </tr>
                    `;
                } else {
                    tbody.innerHTML = `<tr><td colspan="7" style="padding: 12px; text-align: center; color: #9ca3a0;">Kayıt bulunmuyor.</td></tr>`;
                }
            } catch (err) { console.error('Hata:', err); }
        }

        async function deleteReport(id) {
            if (confirm('Bu kaydı silmek istediğinize emin misiniz?')) {
                try {
                    const { error } = await supabaseClient.from('reports').delete().eq('id', id);
                    if (error) throw error;
                    alert('Kayıt başarıyla silindi.');
                    fetchAllReports();
                } catch (err) {
                    alert('Silme başarısız (Ağ veya Bağlantı Hatası): ' + err.message);
                }
            }
        }

        fetchAllReports();
    </script>
</body>
</html>
