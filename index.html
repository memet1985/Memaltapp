<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sweet Waffle - Yönetim Paneli</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen font-sans">
    <div class="container mx-auto px-4 py-6 max-w-6xl">
        
        <!-- Üst Header & Logo Alanı -->
        <header class="bg-white border border-amber-200 rounded-2xl shadow-sm p-4 mb-6 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-12 h-12 bg-amber-100 rounded-full flex items-center justify-center border border-amber-300 overflow-hidden shadow-inner">
                    <!-- Logo görseli veya ikon -->
                    <span class="text-amber-800 font-bold text-xs">Waffle</span>
                </div>
                <h1 class="text-2xl font-bold text-amber-900 tracking-wide">Sweet Waffle Yönetim Paneli</h1>
            </div>
            <div>
                <button onclick="history.back()" class="bg-amber-900 hover:bg-amber-800 text-white px-4 py-2 rounded-xl text-sm font-semibold shadow transition">
                    ← Ana Menüye Dön
                </button>
            </div>
        </header>

        <!-- Şube Başlığı -->
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-2xl font-bold text-amber-900" id="branchTitle">Kurtköy Şubesi Paneli</h2>
        </div>

        <!-- Özet Kartları -->
        <div class="grid grid-cols-2 md:grid-cols-6 gap-3 mb-6">
            <div class="bg-white p-4 rounded-xl border border-amber-100 shadow-sm text-center">
                <p class="text-xs font-semibold text-gray-500 uppercase">Toplam Kayıt</p>
                <p id="statTotalCount" class="text-lg font-bold text-gray-800 mt-1">0</p>
            </div>
            <div class="bg-white p-4 rounded-xl border border-amber-100 shadow-sm text-center">
                <p class="text-xs font-semibold text-gray-500 uppercase">Toplam Nakit</p>
                <p id="statTotalCash" class="text-lg font-bold text-green-600 mt-1">0.00 ₺</p>
            </div>
            <div class="bg-white p-4 rounded-xl border border-amber-100 shadow-sm text-center">
                <p class="text-xs font-semibold text-gray-500 uppercase">Toplam Banka</p>
                <p id="statTotalBank" class="text-lg font-bold text-blue-600 mt-1">0.00 ₺</p>
            </div>
            <div class="bg-white p-4 rounded-xl border border-amber-100 shadow-sm text-center">
                <p class="text-xs font-semibold text-gray-500 uppercase">Toplam Ciro</p>
                <p id="statTotalRevenue" class="text-lg font-bold text-amber-700 mt-1">0.00 ₺</p>
            </div>
            <div class="bg-white p-4 rounded-xl border border-amber-100 shadow-sm text-center">
                <p class="text-xs font-semibold text-gray-500 uppercase">Toplam Masraf</p>
                <p id="statTotalExpense" class="text-lg font-bold text-red-600 mt-1">0.00 ₺</p>
            </div>
            <div class="bg-white p-4 rounded-xl border border-amber-100 shadow-sm text-center">
                <p class="text-xs font-semibold text-gray-500 uppercase">Stok Maliyeti</p>
                <p id="statTotalStock" class="text-lg font-bold text-amber-900 mt-1">0.00 ₺</p>
            </div>
        </div>

        <!-- Yeni Veri Giriş Kartı -->
        <div class="bg-white rounded-2xl border border-amber-200 shadow-sm p-6 mb-8">
            <h3 class="text-lg font-bold text-amber-900 mb-4 pb-2 border-b border-amber-100">Yeni Veri Girişi</h3>
            
            <form id="reportForm" class="space-y-4">
                <!-- Tarih -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Tarih:</label>
                    <input type="date" id="date" class="w-full md:w-1/3 rounded-xl border border-amber-200 shadow-sm p-2.5 text-gray-800 focus:ring-2 focus:ring-amber-500 focus:outline-none" required>
                </div>

                <!-- Ciro Bilgileri -->
                <div>
                    <label class="block text-sm font-semibold text-amber-900 mb-2">Ciro Bilgileri</label>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-medium text-gray-600 mb-1">Nakit Ciro (TL):</label>
                            <input type="number" step="0.01" id="cash" value="0" class="w-full rounded-xl border border-amber-200 shadow-sm p-2.5 focus:ring-2 focus:ring-amber-500 focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-gray-600 mb-1">Banka / Kart (TL):</label>
                            <input type="number" step="0.01" id="bank" value="0" class="w-full rounded-xl border border-amber-200 shadow-sm p-2.5 focus:ring-2 focus:ring-amber-500 focus:outline-none">
                        </div>
                    </div>
                </div>

                <!-- Masraf Ekle -->
                <div>
                    <label class="block text-sm font-semibold text-amber-900 mb-2">Masraf Ekle (Opsiyonel)</label>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-medium text-gray-600 mb-1">Masraf Tutarı (TL):</label>
                            <input type="number" step="0.01" id="expense" value="0" class="w-full rounded-xl border border-amber-200 shadow-sm p-2.5 focus:ring-2 focus:ring-amber-500 focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-gray-600 mb-1">Masraf Açıklaması:</label>
                            <input type="text" id="expenseDesc" placeholder="Örn: Market, kurye ödemesi vs." class="w-full rounded-xl border border-amber-200 shadow-sm p-2.5 focus:ring-2 focus:ring-amber-500 focus:outline-none">
                        </div>
                    </div>
                </div>

                <!-- Stok Girişi -->
                <div>
                    <label class="block text-sm font-semibold text-amber-900 mb-2">Stok Girişi (Opsiyonel)</label>
                    <div class="grid grid-cols-1 md:grid-cols-4 gap-3 items-end">
                        <div>
                            <label class="block text-xs font-medium text-gray-600 mb-1">Ürün / Malzeme Seçin:</label>
                            <div class="flex gap-1">
                                <select id="stockItemSelect" class="w-full rounded-xl border border-amber-200 shadow-sm p-2.5 focus:ring-2 focus:ring-amber-500 focus:outline-none bg-white">
                                    <option value="">-- Ürün Seçin --</option>
                                    <option value="Waffle Hamuru">Waffle Hamuru</option>
                                    <option value="Çikolata Sosu">Çikolata Sosu</option>
                                    <option value="Muz / Çilek">Muz / Çilek</option>
                                    <option value="Kutu / Ambalaj">Kutu / Ambalaj</option>
                                </select>
                                <button type="button" class="bg-amber-800 text-white px-3 py-2 rounded-xl text-xs font-bold hover:bg-amber-700 shadow transition flex items-center gap-1">
                                    + Yeni
                                </button>
                            </div>
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-gray-600 mb-1">Miktar:</label>
                            <input type="number" step="0.01" id="stockQty" value="0" class="w-full rounded-xl border border-amber-200 shadow-sm p-2.5 focus:ring-2 focus:ring-amber-500 focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-gray-600 mb-1">Birim:</label>
                            <select id="stockUnit" class="w-full rounded-xl border border-amber-200 shadow-sm p-2.5 focus:ring-2 focus:ring-amber-500 focus:outline-none bg-white">
                                <option value="KG">KG</option>
                                <option value="Adet">Adet</option>
                                <option value="Paket">Paket</option>
                                <option value="Lt">Lt</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-gray-600 mb-1">Stok Tutarı (TL):</label>
                            <input type="number" step="0.01" id="stockAmount" value="0" class="w-full rounded-xl border border-amber-200 shadow-sm p-2.5 focus:ring-2 focus:ring-amber-500 focus:outline-none">
                        </div>
                    </div>
                </div>

                <!-- Kaydet Butonu -->
                <div class="pt-2">
                    <button type="submit" class="w-full bg-amber-900 hover:bg-amber-800 text-white font-bold py-3.5 px-6 rounded-xl shadow-md transition text-center">
                        Sisteme Kaydet
                    </button>
                </div>
            </form>
        </div>

        <!-- Kayıtlar Tablosu -->
        <div class="bg-white rounded-2xl border border-amber-200 shadow-sm p-6">
            <h3 class="text-lg font-bold text-amber-900 mb-4">Geçmiş Kayıtlar</h3>
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-amber-100">
                    <thead>
                        <tr class="bg-amber-50">
                            <th class="px-4 py-3 text-left text-xs font-semibold text-amber-900 uppercase">Tarih</th>
                            <th class="px-4 py-3 text-left text-xs font-semibold text-amber-900 uppercase">Nakit</th>
                            <th class="px-4 py-3 text-left text-xs font-semibold text-amber-900 uppercase">Banka</th>
                            <th class="px-4 py-3 text-left text-xs font-semibold text-amber-900 uppercase">Toplam Ciro</th>
                            <th class="px-4 py-3 text-left text-xs font-semibold text-amber-900 uppercase">Masraf</th>
                            <th class="px-4 py-3 text-left text-xs font-semibold text-amber-900 uppercase">Stok Maliyeti</th>
                        </tr>
                    </thead>
                    <tbody id="reportTableBody" class="divide-y divide-gray-100 bg-white text-sm">
                        <!-- Dinamik dolacak -->
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <script>
        const currentBranch = 'Kurtköy';

        function getLocalTodayString() {
            const tzOffset = new Date().getTimezoneOffset() * 60000;
            return new Date(Date.now() - tzOffset).toISOString().split('T')[0];
        }

        document.getElementById('date').value = getLocalTodayString();

        async function fetchReports() {
            try {
                const response = await fetch(`http://localhost:5000/api/reports?branch=${currentBranch}`);
                const result = await response.json();
                
                const tbody = document.getElementById('reportTableBody');
                tbody.innerHTML = '';

                let totalC = 0, totalB = 0, totalR = 0, totalE = 0, totalS = 0;

                if (result.success && result.data.length > 0) {
                    document.getElementById('statTotalCount').innerText = result.data.length;

                    result.data.forEach(row => {
                        const c = parseFloat(row.cash) || 0;
                        const b = parseFloat(row.bank) || 0;
                        const r = c + b;
                        const e = parseFloat(row.expense) || 0;
                        const s = parseFloat(row.stock_amount) || 0;

                        totalC += c;
                        totalB += b;
                        totalR += r;
                        totalE += e;
                        totalS += s;

                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td class="px-4 py-3 text-gray-600">${row.date}</td>
                            <td class="px-4 py-3 text-gray-800">${c.toFixed(2)} ₺</td>
                            <td class="px-4 py-3 text-gray-800">${b.toFixed(2)} ₺</td>
                            <td class="px-4 py-3 font-semibold text-amber-700">${r.toFixed(2)} ₺</td>
                            <td class="px-4 py-3 text-red-600">${e.toFixed(2)} ₺</td>
                            <td class="px-4 py-3 text-amber-900">${s.toFixed(2)} ₺</td>
                        `;
                        tbody.appendChild(tr);
                    });

                    document.getElementById('statTotalCash').innerText = totalC.toFixed(2) + ' ₺';
                    document.getElementById('statTotalBank').innerText = totalB.toFixed(2) + ' ₺';
                    document.getElementById('statTotalRevenue').innerText = totalR.toFixed(2) + ' ₺';
                    document.getElementById('statTotalExpense').innerText = totalE.toFixed(2) + ' ₺';
                    document.getElementById('statTotalStock').innerText = totalS.toFixed(2) + ' ₺';
                } else {
                    tbody.innerHTML = `<tr><td colspan="6" class="px-4 py-4 text-center text-gray-400">Henüz kayıt bulunmuyor.</td></tr>`;
                }
            } catch (err) {
                console.error('Veriler alınamadı:', err);
            }
        }

        document.getElementById('reportForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const payload = {
                branch: currentBranch,
                date: document.getElementById('date').value,
                cash: parseFloat(document.getElementById('cash').value) || 0,
                bank: parseFloat(document.getElementById('bank').value) || 0,
                expense: parseFloat(document.getElementById('expense').value) || 0,
                expense_desc: document.getElementById('expenseDesc').value,
                stock_item: document.getElementById('stockItemSelect').value,
                stock_qty: parseFloat(document.getElementById('stockQty').value) || 0,
                stock_unit: document.getElementById('stockUnit').value,
                stock_amount: parseFloat(document.getElementById('stockAmount').value) || 0
            };

            try {
                const response = await fetch('http://localhost:5000/api/reports', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const result = await response.json();
                if (result.success) {
                    alert('Veri başarıyla kaydedildi!');
                    document.getElementById('reportForm').reset();
                    document.getElementById('date').value = getLocalTodayString();
                    fetchReports();
                } else {
                    alert('Kayıt başarısız: ' + result.message);
                }
            } catch (err) {
                console.error('Bağlantı hatası:', err);
                alert('Sunucuya bağlanılamadı!');
            }
        });

        fetchReports();
    </script>
</body>
</html>
