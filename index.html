<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sweet Waffle Yönetim Paneli</title>
    <!-- PWA Manifest Bağlantısı -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#7c3f1e">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #fdfbf7;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        h1 {
            color: #7c3f1e;
            text-align: center;
            font-size: 24px;
        }
        .card {
            background: #faf6f0;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 8px;
            border-left: 5px solid #7c3f1e;
        }
        button {
            background-color: #7c3f1e;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
        }
        button:hover {
            background-color: #5e2f15;
        }
    </style>
</head>
<body>

    <div class="container">
        <div style="text-align: center;">
            <img src="sweet-logo.jpeg" alt="Sweet Waffle Logo" style="width: 100px; height: 100px; border-radius: 50%; object-fit: cover;">
        </div>
        <h1>Sweet Waffle Yönetim Paneli</h1>
        
        <div class="card">
            <h3>Bulut Durumu</h3>
            <p>Sisteminiz başarıyla buluta taşındı ve 7/24 kesintisiz çalışmaya hazır!</p>
        </div>

        <button onclick="alert('Sweet Waffle PWA Aktif!')">Durumu Kontrol Et</button>
    </div>

</body>
</html>
