<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MemAlt - Merkez Yönetim ve Şube Raporları</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-6">

    <div class="max-w-7xl mx-auto">
        <!-- Başlık ve Ay Butonları -->
        <div class="bg-white p-4 rounded-xl shadow mb-6 flex flex-col md:flex-row justify-between items-center gap-4">
            <h1 class="text-xl font-bold text-gray-800">MERKEZ YÖNETİMİ (TÜM ŞUBELER) RAPORLARI LİSTESİ</h1>
            
            <!-- Ay Seçim Butonları -->
            <div class="flex flex-wrap gap-2">
                <button onclick="ayFiltrele('Tumu')" id="btnTumu" class="px-4 py-2 bg-gray-800 text-white rounded-lg text-sm font-medium shadow transition">Tüm Veriler</button>
                <button onclick="ayFiltrele('2026-08')" id="btn2026-08" class="px-4 py-2 bg-gray-200 text-gray-700 rounded-lg text-sm font-medium hover:bg-gray-300 transition">Ağustos 2026</button>
                <button onclick="ayFiltrele('2026-07')" id="btn2026-07" class="px-4 py-2 bg-gray-200 text-gray-700 rounded-lg text-sm font-medium hover:bg-gray-300 transition">Temmuz 2026</button>
            </div>
        </div>

        <!-- Şube ve Tarih Arama / Filtreleme Kutuları -->
        <div class="bg-white p-4 rounded-xl shadow mb-6 grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Şube ile Filtrele / Ara</label>
                <input type="text" id="aramaSube" placeholder="Şube adı yazın (örn: Kurtkoy, Soganlik)..." class="w-full p-2 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Tarih ile Filtrele</label>
                <input type="date" id="aramaTarih" class="w-full p-2 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
        </div>

        <!-- Rapor Tablosu -->
        <div class="bg-white rounded-xl shadow overflow-hidden">
            <table class="min-w-full divide-y divide-gray-200">
                <thead class="bg-gray-50">
                    <tr>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Şube</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Tarih</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Nakit</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Banka</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Yemek Kartları</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Online Platform</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Ciro</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Masraf & Açıklama</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Kalan Nakit</th>
                    </tr>
                </thead>
                <tbody id="raporListesi" class="bg-white divide-y divide-gray-200 text-sm">
                    <!-- Dinamik Veriler Buraya Gelecek -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        let aktifAyFiltresi = 'Tumu';

        function ayFiltrele(ay) {
            aktifAyFiltresi = ay;
            
            // Butonların aktiflik renklerini güncelle
            document.querySelectorAll('#btnTumu, [id^="btn2026"]').forEach(btn => {
                btn.className = "px-4 py-2 bg-gray-200 text-gray-700 rounded-lg text-sm font-medium hover:bg-gray-300 transition";
            });
            
            const aktifBtn = document.getElementById(ay === 'Tumu' ? 'btnTumu' : 'btn' + ay);
            if(aktifBtn) {
                aktifBtn.className = "px-4 py-2 bg-gray-800 text-white rounded-lg text-sm font-medium shadow transition";
            }

            tabloyuGuncelle();
        }

        function tabloyuGuncelle() {
            const aramaSubeDegeri = document.getElementById('aramaSube').value.toLowerCase().trim();
            const aramaTarihDegeri = document.getElementById('aramaTarih').value;

            // localStorage'dan kayıtlı verileri alıyoruz
            const tumRaporlar = JSON.parse(localStorage.getItem('memaltRaporlar')) || [];
            const tabloGovdesi = document.getElementById('raporListesi');
            tabloGovdesi.innerHTML = '';

            const filtrelenmis = tumRaporlar.filter(item => {
                // 1. Ay Butonları Filtresi
                let ayUyumlu = true;
                if (aktifAyFiltresi !== 'Tumu' && item.tarih) {
                    ayUyumlu = item.tarih.startsWith(aktifAyFiltresi);
                }

                // 2. Şube Arama Kutusu Filtresi
                let subeUyumlu = true;
                if (aramaSubeDegeri && item.subeAdi) {
                    subeUyumlu = item.subeAdi.toLowerCase().includes(aramaSubeDegeri);
                }

                // 3. Tarih Seçim Kutusu Filtresi
                let tarihUyumlu = true;
                if (aramaTarihDegeri && item.tarih) {
                    tarihUyumlu = (item.tarih === aramaTarihDegeri);
                }

                return ayUyumlu && subeUyumlu && tarihUyumlu;
            });

            if (filtrelenmis.length === 0) {
                tabloGovdesi.innerHTML = `<tr><td colspan="9" class="px-6 py-4 text-center text-gray-500">Seçilen kriterlere uygun kayıt bulunamadı.</td></tr>`;
                return;
            }

            filtrelenmis.forEach(item => {
                tabloGovdesi.innerHTML += `
                    <tr>
                        <td class="px-6 py-4 whitespace-nowrap font-medium text-gray-900">${item.subeAdi || ''}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-gray-700">${item.tarih || ''}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-gray-700">${Number(item.nakit || 0).toLocaleString('tr-TR')} ₺</td>
                        <td class="px-6 py-4 whitespace-nowrap text-gray-700">${Number(item.banka || 0).toLocaleString('tr-TR')} ₺</td>
                        <td class="px-6 py-4 whitespace-nowrap text-gray-700">${Number(item.yemekKartlari || 0).toLocaleString('tr-TR')} ₺</td>
                        <td class="px-6 py-4 whitespace-nowrap text-gray-700">${Number(item.onlinePlatform || 0).toLocaleString('tr-TR')} ₺</td>
                        <td class="px-6 py-4 whitespace-nowrap font-bold text-gray-900">${Number(item.ciro || 0).toLocaleString('tr-TR')} ₺</td>
                        <td class="px-6 py-4 whitespace-nowrap text-red-600">${Number(item.masrafTutar || 0).toLocaleString('tr-TR')} ₺ (${item.masrafAciklama || ''})</td>
                        <td class="px-6 py-4 whitespace-nowrap font-bold text-green-600">${Number(item.kalanNakit || 0).toLocaleString('tr-TR')} ₺</td>
                    </tr>
                `;
            });
        }

        // Event Dinleyicileri
        document.getElementById('aramaSube').addEventListener('input', tabloyuGuncelle);
        document.getElementById('aramaTarih').addEventListener('change', tabloyuGuncelle);

        // Sayfa yüklendiğinde çalıştır
        window.onload = tabloyuGuncelle;
    </script>
</body>
</html>
