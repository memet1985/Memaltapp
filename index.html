<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MemAlt Uygulama</title>
    <style>
        /* Genel Stiller ve Sıfırlama */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        button {
            cursor: pointer;
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            color: white;
        }
        .btn-primary { background-color: #007bff; }
        .btn-danger { background-color: #dc3545; }
        .btn-secondary { background-color: #6c757d; }

        /* Özel Onay Modalı Stilleri */
        .custom-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        .custom-modal-content {
            background: #fff;
            padding: 25px 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        .custom-modal-buttons {
            margin-top: 20px;
            display: flex;
            justify-content: center;
            gap: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>MemAlt Raporlama ve Yönetim</h2>
        <p>Silme veya düzenleme işlemlerini test etmek için aşağıdaki butonları kullanabilirsiniz:</p>
        <div style="display: flex; gap: 10px; flex-wrap: wrap;">
            <button class="btn-danger" onclick="kaydiSil(1)">Örnek Kaydı Sil</button>
            <button class="btn-secondary" onclick="tercihleriSifirla()">"Bir daha sorma" Tercihini Sıfırla</button>
        </div>
    </div>

    <!-- Özel Onay Modalı HTML Yapısı -->
    <div id="customConfirmModal" class="custom-modal" style="display: none;">
        <div class="custom-modal-content">
            <p id="confirmMessage" style="font-size: 16px; font-weight: bold; margin-bottom: 15px;">Bu işlemi yapmak istediğinize emin misiniz?</p>
            <div style="margin: 15px 0; text-align: left;">
                <label style="cursor: pointer; font-size: 14px; display: flex; align-items: center; gap: 8px;">
                    <input type="checkbox" id="dontAskAgainCheckbox" style="width: 16px; height: 16px;"> Bir daha bu soruyu sorma
                </label>
            </div>
            <div class="custom-modal-buttons">
                <button id="confirmYesBtn" class="btn-primary" style="padding: 8px 20px;">Tamam</button>
                <button id="confirmNoBtn" class="btn-secondary" style="padding: 8px 20px;">Vazgeç</button>
            </div>
        </div>
    </div>

    <!-- JavaScript Kodları -->
    <script>
        // Sayfa yüklendiğinde butonlara bir kere olay dinleyicisi atanır
        document.addEventListener('DOMContentLoaded', () => {
            const modal = document.getElementById('customConfirmModal');
            const yesBtn = document.getElementById('confirmYesBtn');
            const noBtn = document.getElementById('confirmNoBtn');
            const checkbox = document.getElementById('dontAskAgainCheckbox');

            let currentCallback = null;

            // Evet butonuna tıklama olayı
            yesBtn.addEventListener('click', () => {
                if (checkbox.checked) {
                    localStorage.setItem('skipDeleteConfirm', 'true');
                }
                modal.style.display = 'none';
                if (typeof currentCallback === 'function') {
                    currentCallback(true);
                }
            });

            // Hayır / Vazgeç butonuna tıklama olayı
            noBtn.addEventListener('click', () => {
                modal.style.display = 'none';
                if (typeof currentCallback === 'function') {
                    currentCallback(false);
                }
            });

            // Global fonksiyon olarak dışarıya açıyoruz
            window.showCustomConfirm = function(message, callback) {
                // Eğer kullanıcı daha önceden "bir daha sorma" seçeneğini işaretlediyse direkt onay ver
                if (localStorage.getItem('skipDeleteConfirm') === 'true') {
                    callback(true);
                    return;
                }

                const msgEl = document.getElementById('confirmMessage');
                msgEl.textContent = message;
                checkbox.checked = false;
                currentCallback = callback;
                modal.style.display = 'flex';
            };
        });

        // Silme veya Düzenleme butonunuzun tetikleyeceği fonksiyon
        function kaydiSil(id) {
            showCustomConfirm("Bu raporu kalıcı olarak silmek istediğinize emin misiniz?", (isConfirmed) => {
                if (isConfirmed) {
                    // Buraya gerçek silme kodunuz (fetch, DOM silme vb.) gelecek
                    alert("Kayıt başarıyla silindi!");
                    console.log("Silinen ID:", id);
                } else {
                    console.log("İşlem iptal edildi.");
                }
            });
        }

        // Test amaçlı localStorage tercihini sıfırlama fonksiyonu
        function tercihleriSifirla() {
            localStorage.removeItem('skipDeleteConfirm');
            alert("Onay tercihiniz sıfırlandı. Artık modal tekrar görünecek.");
        }
    </script>
</body>
</html>
