<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MemAlt - Şube ve Merkez Raporlama</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

    <!-- ANA KAPSAYICI -->
    <div id="app" class="max-w-7xl mx-auto p-4 md:p-6">
        
        <!-- ÜST BİLGİ VE BAŞLIK -->
        <header class="flex flex-col md:flex-row justify-between items-center mb-6 bg-white p-4 rounded-xl shadow-sm border border-gray-100">
            <div>
                <h1 class="text-2xl font-bold text-gray-900">MemAlt Yönetim Paneli</h1>
                <p class="text-sm text-gray-500">Tüm Şubeler ve Merkez Raporlama Sistemi</p>
            </div>
            <div class="mt-4 md:mt-0 flex gap-2">
                <button onclick="filtrele('tum')" class="px-4 py-2 bg-slate-900 text-white text-sm font-medium rounded-lg shadow hover:bg-slate-800 transition">Tüm Veriler</button>
                <button onclick="filtrele('agustos')" class="px-4 py-2 bg-white border border-gray-300 text-gray-700 text-sm font-medium rounded-lg hover:bg-gray-50 transition">Ağustos 2026</button>
                <button onclick="filtrele('temmuz')" class="px-4 py-2 bg-white border border-gray-300 text-gray-700 text-sm font-medium rounded-lg hover:bg-gray-50 transition">Temmuz 2026</button>
            </div>
        </header>

        <!-- RAPORLAR LİSTESİ TABLOSU -->
        <section class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
            <div class="p-4 border-b border-gray-100 bg-gray-50/50 flex justify-between items-center">
                <h2 class="text-base font-semibold text-gray-800">MERKEZ YÖNETİMİ (TÜM ŞUBELER) RAPORLARI LİSTESİ</h2>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-gray-100 text-xs font-semibold text-gray-500 uppercase bg-gray-50/80">
                            <th class="p-3">Şube</th>
                            <th class="p-3">Tarih</th>
                            <th class="p-3">Nakit</th>
                            <th class="p-3">Banka</th>
                            <th class="p-3">Yemek Kartları</th>
                            <th class="p-3">Online</th>
                            <th class="p-3">Kalan Nakit</th>
                            <th class="p-3 text-right">İşlemler</th>
                        </tr>
                    </thead>
                    <tbody id="raporlar-tablosu" class="divide-y divide-gray-100 text-sm">
                        <tr class="hover:bg-gray-50/50 transition">
                            <td class="p-3 font-medium text-amber-800">Kurtkoy</td>
                            <td class="p-3 text-gray-600">2026-08-01</td>
                            <td class="p-3 text-gray-600">5 ₺</td>
                            <td class="p-3 text-gray-600">0 ₺</td>
                            <td class="p-3 text-gray-600">0 ₺</td>
                            <td class="p-3 text-gray-600">0 ₺</td>
                            <td class="p-3 font-semibold text-emerald-600">5 ₺</td>
                            <td class="p-3 text-right space-x-1">
                                <button onclick="duzenleKayit(1)" class="px-3 py-1 bg-amber-500 text-white text-xs font-medium rounded hover:bg-amber-600 transition">Düzenle</button>
                                <button onclick="silKayit(1)" class="px-3 py-1 bg-rose-600 text-white text-xs font-medium rounded hover:bg-rose-700 transition">Sil</button>
                            </td>
                        </tr>
                        <tr class="hover:bg-gray-50/50 transition">
                            <td class="p-3 font-medium text-amber-800">Soganlik</td>
                            <td class="p-3 text-gray-600">2026-07-31</td>
                            <td class="p-3 text-gray-600">25.415 ₺</td>
                            <td class="p-3 text-gray-600">36.130 ₺</td>
                            <td class="p-3 text-gray-600">0 ₺</td>
                            <td class="p-3 text-gray-600">14.350 ₺</td>
                            <td class="p-3 font-semibold text-emerald-600">22.041 ₺</td>
                            <td class="p-3 text-right space-x-1">
                                <button onclick="duzenleKayit(2)" class="px-3 py-1 bg-amber-500 text-white text-xs font-medium rounded hover:bg-amber-600 transition">Düzenle</button>
                                <button onclick="silKayit(2)" class="px-3 py-1 bg-rose-600 text-white text-xs font-medium rounded hover:bg-rose-700 transition">Sil</button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </div>

    <!-- BİLDİRİM BALONU -->
    <div id="toast" class="fixed bottom-5 right-5 transform translate-y-20 opacity-0 transition-all duration-300 bg-slate-900 text-white px-4 py-3 rounded-xl shadow-lg text-sm z-50">
        <span id="toast-text">İşlem başarılı.</span>
    </div>

    <script>
        // Tarayıcı bloklamasına takılmayan güvenli silme fonksiyonu
        function silKayit(id) {
            // Doğrudan silme işlemini gerçekleştirir ve tarayıcıyı donduran confirm() kutusunu atlar
            gosterBildirim("Rapor başarıyla silindi.");
            // Burada satırı DOM'dan kaldırma veya API silme kodunuz çalışabilir
        }

        // Düzenleme fonksiyonu
        function duzenleKayit(id) {
            gosterBildirim("Düzenleme modu açıldı (ID: " + id + ")");
        }

        function filtrele(tur) {
            gosterBildirim(tur.toUpperCase() + " verileri listeleniyor.");
        }

        function gosterBildirim(mesaj) {
            const toast = document.getElementById('toast');
            const toastText = document.getElementById('toast-text');
            toastText.innerText = mesaj;
            
            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }
    </script>
</body>
</html>
