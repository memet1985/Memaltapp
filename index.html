<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sweet Waffle - Merkez Yönetim Paneli</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#78350f">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; -webkit-text-size-adjust: 100%; }
        html, body { width: 100%; max-width: 100vw; overflow-x: hidden; margin: 0; padding: 0; background-color: #f9fafb; }
        input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }
    </style>
</head>
<body class="font-sans pb-10">
    <div style="width: 100%; max-width: 100%; margin: 0 auto; padding: 8px;">
        
        <!-- Üst Header -->
        <header style="background: #fff; border: 1px solid #fcd34d; border-radius: 12px; padding: 10px; margin-bottom: 12px; box-shadow: 0 1px 2px rgba(0,0,0,0.05);">
            <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; flex-wrap: wrap; gap: 8px;">
                <div style="display: flex; align-items: center; gap: 8px;">
                    <div style="width: 36px; height: 36px; background: #fffbeb; border: 1px solid #78350f; border-radius: 8px; display: flex; align-items: center; justify-content: center; overflow: hidden; flex-shrink: 0;">
                        <img src="logo.webp" alt="Logo" style="width: 100%; height: 100%; object-fit: contain;" onerror="this.style.display='none'; document.getElementById('merkezLogoFallback').style.display='flex';">
                        <div id="merkezLogoFallback" style="width: 100%; height: 100%; background: #78350f; color: #fff; font-weight: bold; font-size: 8px; display: none; align-items: center; justify-content: center;">LOGO</div>
                    </div>
                    <div>
                        <h1 style="font-size: 13px; font-weight: 900; color: #451a03; margin: 0;">Sweet Waffle - Merkez</h1>
                        <p style="font-size: 9px; color: #6b7280; margin: 0;">Tüm Şube Raporları</p>
                    </div>
                </div>
                
                <div style="display: flex; gap: 4px; flex-wrap: wrap;">
                    <a href="index.html" style="background: #78350f; color: #fff; border: 1px solid #78350f; padding: 6px 8px; border-radius: 6px; font-size: 10px; font-weight: bold; text-decoration: none;">MERKEZ</a>
                    <a href="sube.html?ad=Kurtkoy" style="background: #fffbeb; color: #78350f; border: 1px solid #fde68a; padding: 6px 8px; border-radius: 6px; font-size: 10px; font-weight: bold; text-decoration: none;">Kurtköy</a>
                    <a href="sube.html?ad=Soganlik" style="background: #fffbeb; color: #78350f; border: 1px solid #fde68a; padding: 6px 8px; border-radius: 6px; font-size: 10px; font-weight: bold; text-decoration: none;">Soğanlık</a>
                    <a href="sube.html?ad=Ortadag" style="background: #fffbeb; color: #78350f; border: 1px solid #fde68a; padding: 6px 8px; border-radius: 6px; font-size: 10px; font-weight: bold; text-decoration: none;">Ortadağ</a>
                </div>
            </div>
        </header>

        <!-- Özet Kartları -->
        <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 12px;">
            <div style="background: #fff; border: 1px solid #fde68a; border-radius: 10px; padding: 10px; box-shadow: 0 1px 2px rgba(0,0,0,0.05);">
                <p style="font-size: 9px; color: #6b7280; font-weight: bold; margin: 0 0 2px 0;">TOPLAM CİRO</p>
                <h3 id="totalRevenue" style="font-size: 15px; font-weight: 900; color: #047857; margin: 0;">0 ₺</h3>
            </div>
            <div style="background: #fff; border: 1px solid #fde68a; border-radius: 10px; padding: 10px; box-shadow: 0 1px 2px rgba(0,0,0,0.05);">
                <p style="font-size: 9px; color: #6b7280; font-weight: bold; margin: 0 0 2px 0;">TOPLAM MASRAF</p>
                <h3 id="totalExpense" style="font-size: 15px; font-weight: 900; color: #dc2626; margin: 0;">0 ₺</h3>
            </div>
        </div>

        <!-- Şubelerden Gelen Tüm Raporlar Tablosu -->
        <div style="background: #fff; border: 1px solid #fde68a; border-radius: 12px; padding: 12px; box-shadow: 0 1px 2px rgba(0,0,0,0.05);">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                <h3 style="font-size: 11px; font-weight: bold; color: #78350f; margin: 0; text-transform: uppercase;">Şube Günlük Rapor Akışı</h3>
                <button onclick="fetchAllReports()" style="background: #fffbeb; color: #78350f; border: 1px solid #fde68a; padding: 4px 8px; border-radius: 4px; font-size: 9px; font-weight: bold; cursor: pointer;">Yenile</button>
            </div>
            <div style="width: 100%; overflow-x: auto;">
                <table style="width: 100%; min-width: 750px; border-collapse: collapse; font-size: 10px;">
                    <thead>
                        <tr style="background: #fffbeb; color: #78350f;">
                            <th style="padding: 6px; text-align: left; font-weight: 600;">ŞUBE</th>
                            <th style="padding: 6px; text-align: left; font-weight: 600;">TARİH</th>
                            <th style="padding: 6px; text-align: left; font-weight: 600;">NAKİT</th>
                            <th style="padding: 6px; text-align: left; font-weight: 600;">BANKA</th>
                            <th style="padding: 6px; text-align: left; font-weight: 600;">YEMEK KARTLARI</th>
                            <th style="padding: 6px; text-align: left; font-weight: 600;">MASRAF</th>
                            <th style="padding: 6px; text-align: left; font-weight: 600;">İŞLEM</th>
                        </tr>
                    </thead>
                    <tbody id="allReportsTableBody">
                        <tr><td colspan="7" style="padding: 12px; text-align: center; color: #9ca3af;">Yükleniyor...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://yatgnoiybbjvmreikeqs.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_8BxYi7oOUnHvkHAJQNaitQ_kKlHk_Y_'; 
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function formatMoney(val) {
            if (val === null || val === undefined || val === '') return '0';
            let num = Number(val);
            if (isNaN(num)) return '0';
            return num.toLocaleString('tr-TR', { maximumFractionDigits: 2 });
        }

        function cleanVal(val) {
            let num = Number(val);
            return isNaN(num) ? 0 : num;
        }

        async function fetchAllReports() {
            try {
                const { data, error } = await supabaseClient
                    .from('reports')
                    .select('*')
                    .order('date', { ascending: false });

                if (error) throw error;

                const tbody = document.getElementById('allReportsTableBody');
                tbody.innerHTML = '';

                let totalRevSum = 0;
                let totalExpSum = 0;

                if (data && data.length > 0) {
                    data.forEach(row => {
                        const c = cleanVal(row.cash);
                        const b = cleanVal(row.bank);
                        const pTotal = cleanVal(row.platform_pluxee) + 
                                       cleanVal(row.platform_edenred) + 
                                       cleanVal(row.platform_multinet) + 
                                       cleanVal(row.platform_setcard) + 
                                       cleanVal(row.platform_metropol) + 
                                       cleanVal(row.platform_token);
                        const e = cleanVal(row.expense);

                        const rowTotalRev = c + b + pTotal;
                        totalRevSum += rowTotalRev;
                        totalExpSum += e;

                        const tr = document.createElement('tr');
                        tr.style.borderBottom = '1px solid #f3f4f6';
                        tr.innerHTML = `
                            <td style="padding: 6px; font-weight: bold; color: #451a03;">${row.branch || '-'}</td>
                            <td style="padding: 6px; color: #4b5563;">${row.date || '-'}</td>
                            <td style="padding: 6px; color: #1f2937;">${formatMoney(c)}</td>
                            <td style="padding: 6px; color: #1f2937;">${formatMoney(b)}</td>
                            <td style="padding: 6px; color: #047857;">${formatMoney(pTotal)}</td>
                            <td style="padding: 6px; color: #dc2626;">${formatMoney(e)}</td>
                            <td style="padding: 6px;">
                                <button onclick="deleteReport(${row.id})" style="background: #fee2e2; color: #dc2626; border: none; padding: 3px 6px; border-radius: 4px; font-size: 9px; cursor: pointer; font-weight: bold;">Sil</button>
                            </td>
                        `;
                        tbody.appendChild(tr);
                    });
                } else {
                    tbody.innerHTML = `<tr><td colspan="7" style="padding: 12px; text-align: center; color: #9ca3af;">Henüz şubelerden girilmiş bir rapor bulunmuyor.</td></tr>`;
                }

                document.getElementById('totalRevenue').innerText = formatMoney(totalRevSum) + ' ₺';
                document.getElementById('totalExpense').innerText = formatMoney(totalExpSum) + ' ₺';

            } catch (err) {
                console.error('Veri çekme hatası:', err);
                document.getElementById('allReportsTableBody').innerHTML = `<tr><td colspan="7" style="padding: 12px; text-align: center; color: #dc2626;">Veriler yüklenirken hata oluştu.</td></tr>`;
            }
        }

        async function deleteReport(id) {
            if (!confirm('Bu raporu silmek istediğinize emin misiniz?')) return;
            try {
                const { error } = await supabaseClient
                    .from('reports')
                    .delete()
                    .eq('id', id);

                if (error) throw error;
                fetchAllReports();
            } catch (err) {
                alert('Silme başarısız: ' + err.message);
            }
        }

        fetchAllReports();
    </script>
</body>
</html>
